name: Standalone Ephemeral Checks

on:
  pull_request:
    paths:
      - '.github/workflows/standalone-ephemeral*.yml'
      - 'scripts/ephemeral/**'
      - 'apps/Standalone/**'
      - 'e2e/ephemeral/**'
      - 'playwright.ephemeral.config.ts'
      - 'turbo.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/standalone-ephemeral*.yml'
      - 'scripts/ephemeral/**'
      - 'apps/Standalone/**'
      - 'e2e/ephemeral/**'
      - 'playwright.ephemeral.config.ts'
      - 'turbo.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec vitest run --config scripts/vitest.config.ts scripts/ephemeral apps/Standalone/vite-plugins/__test__
      - run: python3 -B -m unittest discover -s scripts/ephemeral -p 'test_*.py'
      - run: pnpm turbo run build:ephemeral --filter=standalone
      - name: Validate the production preview artifact
        run: python3 -B scripts/ephemeral/validate.py --directory apps/Standalone/dist .ephemeral-site
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.ephemeral.config.ts
