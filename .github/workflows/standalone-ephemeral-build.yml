name: Build Standalone Ephemeral

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: standalone-ephemeral-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: vars.EPHEMERAL_ENABLED == 'true' && contains(github.event.pull_request.labels.*.name, 'ephemeral')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm turbo run build:ephemeral --filter=standalone
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: standalone-ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: apps/Standalone/dist
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
