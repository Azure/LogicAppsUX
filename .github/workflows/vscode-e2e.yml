name: VS Code Extension E2E Tests

on:
  push:
    branches: [main, dev/*, hotfix/*]
    paths:
      - 'apps/vs-code-designer/**'
      - 'apps/vs-code-react/**'
      - 'libs/vscode-extension/**'
      - 'libs/designer/**'
      - 'libs/designer-ui/**'
      - 'libs/designer-v2/**'
      - 'libs/logic-apps-shared/**'
      - 'libs/data-mapper-v2/**'
      - 'libs/data-mapper/**'
      - 'libs/chatbot/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vscode-e2e.yml'
  pull_request:
    branches: [main, dev/*, hotfix/*]
    paths:
      - 'apps/vs-code-designer/**'
      - 'apps/vs-code-react/**'
      - 'libs/vscode-extension/**'
      - 'libs/designer/**'
      - 'libs/designer-ui/**'
      - 'libs/designer-v2/**'
      - 'libs/logic-apps-shared/**'
      - 'libs/data-mapper-v2/**'
      - 'libs/data-mapper/**'
      - 'libs/chatbot/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vscode-e2e.yml'
  # Manual trigger so PR authors and chief-engineer agents can force a CI
  # re-run on the latest PR head (useful when path-filter coalescing
  # suppresses an expected auto-trigger after rapid pushes).
  workflow_dispatch:

concurrency:
  group: vscode-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the extension + compile the E2E test bundle ONCE per workflow run,
  # then fan out to the matrix shards which download the resulting artifact.
  # This eliminates ~3min of duplicated pnpm install + turbo build + tsup
  # work that previously ran on each of the 5 matrix shards in parallel.
  setup-extension-build:
    name: setup-extension-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build-artifact: extension-build-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          # Content-based key: hits across pushes that don't change source.
          # Previously keyed on github.sha which missed on every push.
          key: ${{ runner.os }}-turbo-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'libs/**/*.ts', 'libs/**/*.tsx', 'pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          # Mirrors the matrix-job symlink step. Kept here so any tooling
          # invoked during build (turbo, tsup) that shells out to /usr/bin/node
          # resolves correctly. The matrix shards re-do this on their own
          # runners because each matrix entry is an independent VM.
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Cache the pnpm content-addressed store so matrix shards can rehydrate
      # node_modules faster on warm runs. The setup-extension-build job warms
      # this cache by running a full install below; shards restore the cache
      # and pnpm reuses store entries while falling back to the network for
      # anything missing (no --offline strictness).
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Build extension
        run: pnpm turbo run build:extension --cache-dir=.turbo

      - name: Compile E2E tests
        working-directory: apps/vs-code-designer
        run: npx tsup --config tsup.e2e.test.config.ts

      - name: Tar build artifacts
        # Tar preserves symlinks/permissions and dramatically speeds upload
        # vs uploading thousands of small files in node_modules-adjacent dirs.
        run: |
          tar -czf extension-build.tar.gz \
            apps/vs-code-designer/dist/ \
            apps/vs-code-designer/out/ \
            $(find apps/vs-code-designer/node_modules/.cache -maxdepth 0 -type d 2>/dev/null)

      - name: Upload extension build artifact
        uses: actions/upload-artifact@v6
        with:
          name: extension-build-${{ github.sha }}
          path: extension-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Run the fixtures-only scenario (p41a) ONCE per workflow run. Uploads
  # the resulting workspace tree + created-workspaces.json manifest so the
  # downstream per-scenario matrix shards can hydrate them instead of
  # paying the wizard-driven workspace creation cost on every shard.
  setup-fixtures:
    name: setup-fixtures (p41a)
    needs: setup-extension-build
    runs-on: ubuntu-latest
    # Headroom for one fresh-session retry (LA_E2E_SCENARIO_RETRIES) if the
    # fixtures scenario flakes, so the retry isn't killed mid-run.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      - name: Cache Logic Apps runtime dependencies
        uses: actions/cache@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Run fixtures scenario (p41a-fixtures)
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: p41a-fixtures
          LA_E2E_STRICT_DEPENDENCY_VALIDATION: '1'
          # Retry a flaky fixtures run once in a fresh session before failing the
          # setup job (which would block every downstream shard). Non-masking: a
          # genuine failure still goes red after the retry.
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          # Node's os.tmpdir() honors TMPDIR/TMP/TEMP on Linux; setting TEMP
          # pins workspace + manifest creation under $RUNNER_TEMP/la-e2e-test
          # so the artifact upload below has a stable, scoped path.
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Verify Logic Apps extension bundle sidecar
        run: |
          BUNDLE_ROOT="${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle.Workflows"
          node - "$BUNDLE_ROOT" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2];
          if (!fs.existsSync(root)) {
            throw new Error(`Bundle root missing: ${root}`);
          }
          const versions = fs.readdirSync(root)
            .filter((name) => /^\d+\.\d+\.\d+/.test(name) && fs.statSync(path.join(root, name)).isDirectory())
            .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
          if (versions.length === 0) {
            throw new Error(`No bundle version folders under ${root}`);
          }
          const bundleDir = path.join(root, versions[0]);
          const sidecarPath = path.join(bundleDir, '.bundle-source-md5');
          if (!fs.existsSync(sidecarPath)) {
            throw new Error(`Bundle sidecar missing: ${sidecarPath}`);
          }
          const sidecar = JSON.parse(fs.readFileSync(sidecarPath, 'utf8'));
          if (!sidecar || typeof sidecar.sourceMd5 !== 'string' || typeof sidecar.contentHash !== 'string') {
            throw new Error(`Bundle sidecar missing sourceMd5/contentHash: ${sidecarPath}`);
          }
          const entries = fs.readdirSync(bundleDir).filter((name) => name !== '.bundle-source-md5');
          if (entries.length === 0) {
            throw new Error(`Bundle directory has no extracted content: ${bundleDir}`);
          }
          console.log(`Bundle verified: ${bundleDir}`);
          console.log(`Sidecar: ${sidecarPath}`);
          NODE

      - name: Verify fixtures manifest exists
        run: |
          MANIFEST="${RUNNER_TEMP}/la-e2e-test/created-workspaces.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Fixtures manifest missing at $MANIFEST"
            ls -la "${RUNNER_TEMP}/la-e2e-test" || true
            exit 1
          fi
          echo "Manifest contents:"
          cat "$MANIFEST"

      - name: Tar created workspaces + manifest
        run: |
          tar -czf workspace-fixtures.tar.gz -C "${RUNNER_TEMP}" la-e2e-test

      - name: Tar Logic Apps extension bundle
        run: |
          tar -czf logic-apps-extension-bundle.tar.gz \
            -C "${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles" \
            Microsoft.Azure.Functions.ExtensionBundle.Workflows

      - name: Upload workspace fixtures artifact
        uses: actions/upload-artifact@v6
        with:
          name: workspace-fixtures-${{ github.sha }}
          path: workspace-fixtures.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload Logic Apps extension bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: logic-apps-extension-bundle-${{ github.sha }}
          path: logic-apps-extension-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload fixture screenshots on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: vscode-e2e-screenshots-setup-fixtures
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  vscode-e2e:
    name: vscode-e2e (${{ matrix.shard }})
    needs: [setup-extension-build, setup-fixtures]
    # Grouped shards run scenarios sequentially and each failing scenario may
    # retry once in a fresh session (LA_E2E_SCENARIO_RETRIES). 35m gives the
    # heaviest group room for a retry without a timeout-induced failure.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Scenarios are grouped onto fewer runners to amortize the fixed CI
          # setup cost (pnpm install, node symlink, xvfb apt-get, artifact
          # download/extract, bundle + fixtures hydration) that each shard pays
          # once. `scenario` is a comma-separated list consumed by
          # LA_E2E_SCENARIO; run-e2e.js runs each entry in its OWN fresh VS Code
          # session (prepareFreshSession kills lingering processes between
          # scenarios), so grouping preserves per-scenario isolation — it is NOT
          # the flaky "multiple tests in one window" pattern. A failing scenario
          # still runs its siblings and fails the shard (aggregate = max exit).
          # use_* flags are the union of the group's needs.
          #
          # Extension activation smoke (p40) + create-a-project-for-conversion
          # (p48b). Grouped because both are fixture-independent and self-create
          # any workspace they need.
          - shard: activation-and-create
            scenario: p40-nonlogicapp,p48b-conversioncreate
            use_workspace_fixtures: false
            use_bundle_artifact: false
          # Full 12-shape workspace-creation wizard validation — self-creates its
          # own workspaces, so it doesn't consume the fixtures artifact, but it
          # still consumes the setup-fixtures bundle artifact and runs bundle
          # preflight. Kept on its own shard because it is the heaviest scenario.
          - shard: workspace-creation
            scenario: p41b-createworkspace-behavior
            use_workspace_fixtures: false
            use_bundle_artifact: true
          # Designer open → edit → save → debug → run lifecycle across app types.
          - shard: designer-lifecycle
            scenario: p42-standard,p42-customcode,p42-rulesengine
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Runtime-touching action tests (execute code / rules engine).
          - shard: runtime-actions
            scenario: p43-inlinejavascript,p43-customcode,p43-rulesengine
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Designer editing interactions: variables, extended view (parallel
          # branches / run-after), keyboard navigation.
          - shard: designer-interactions
            scenario: p44-statelessvariables,p45-designerviewextended,p46-keyboardnav,p49-descriptionpersistence
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Multi-designer + dataMapper suite (manifest-multi) + bundle repair.
          - shard: suite-and-bundle
            scenario: p47-suite,p412-bundlerepair
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Legacy project → workspace conversion variants.
          - shard: project-conversion
            scenario: p48a-conversionno,p48c-multipledesigners,p48d-conversionyes,p48e-conversionsubfolder
            use_workspace_fixtures: true
            use_bundle_artifact: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          # See setup-extension-build for the rationale. The Functions host
          # spawned by xvfb-run -> VS Code -> extension does not inherit the
          # workflow PATH from actions/setup-node, so we symlink into
          # /usr/bin and /usr/local/bin where any sanitized PATH will find it.
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done
          echo "Symlinked node $(node --version) into /usr/local/bin and /usr/bin"
          env -i /usr/bin/node --version

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      # Scenarios that self-create their workspaces set use_workspace_fixtures=false.
      - name: Download workspace fixtures artifact
        if: matrix.use_workspace_fixtures == true
        uses: actions/download-artifact@v7
        with:
          name: workspace-fixtures-${{ github.sha }}
          path: .

      - name: Extract workspace fixtures into $RUNNER_TEMP
        if: matrix.use_workspace_fixtures == true
        run: |
          mkdir -p "${RUNNER_TEMP}"
          tar -xzf workspace-fixtures.tar.gz -C "${RUNNER_TEMP}"
          echo "Extracted fixtures:"
          ls -la "${RUNNER_TEMP}/la-e2e-test" || true
          if [ -f "${RUNNER_TEMP}/la-e2e-test/created-workspaces.json" ]; then
            echo "Manifest:"
            cat "${RUNNER_TEMP}/la-e2e-test/created-workspaces.json"
          fi

      - name: Download Logic Apps extension bundle artifact
        if: matrix.use_bundle_artifact == true
        uses: actions/download-artifact@v7
        with:
          name: logic-apps-extension-bundle-${{ github.sha }}
          path: .

      - name: Extract Logic Apps extension bundle
        if: matrix.use_bundle_artifact == true
        run: |
          mkdir -p "${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles"
          tar -xzf logic-apps-extension-bundle.tar.gz -C "${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles"
          find "${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle.Workflows" -maxdepth 2 -type f -name '.bundle-source-md5' -print

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      - name: Cache Logic Apps runtime dependencies
        uses: actions/cache@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Run scenario group (${{ matrix.shard }})
        # Each shard runs one or more scenarios (comma-separated in
        # matrix.scenario) sequentially, each in its own fresh VS Code session.
        # Phase 4.1 (commits 2672168f7 + d866b3368) targeted the historically-
        # flaky scenarios (p42-standard, p42-customcode, p42-rulesengine,
        # p46-keyboardnav, p47-suite) at the root cause, and added a focus-reset
        # for the pre-existing p48d-conversionyes xvfb race.
        #
        # continue-on-error stays off so any future regression is surfaced as a
        # job-level failure (no longer masked). Flake closure gating is
        # structural: a red shard fails the workflow. run-e2e.js aggregates
        # exit = max across the group, so a failing scenario still runs its
        # siblings and fails the shard, and the failure mode + CI diff are
        # visible immediately instead of hidden behind allowFailure.
        run: |
          # Belt-and-suspenders PATH export (see grouped-shard rationale in git history).
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "PATH=$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          # Grouped matrix: each shard runs one or more scenarios[] entries.
          LA_E2E_SCENARIO: ${{ matrix.scenario }}
          LA_E2E_BUNDLE_PREFLIGHT: ${{ matrix.use_bundle_artifact && '1' || '0' }}
          # Retry a failing scenario once in a fresh VS Code session to absorb
          # transient xvfb/focus/cold-start races. Non-masking: a scenario that
          # fails both attempts still fails the shard; a retry-to-pass is logged
          # as a `::warning::` flake so the race can still be root-caused.
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          # Pin os.tmpdir() so the bootstrapper finds the manifest the
          # setup-fixtures job uploaded (same RUNNER_TEMP layout).
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage B beachhead (Windows parity): prove the windows-latest toolchain on
  # ONE cheap, high-signal scenario (p40 activation smoke) before fanning
  # windows-latest out across the full matrix (Stage D). Kept as a DEDICATED
  # job — not a `matrix.os` entry on vscode-e2e — so the existing ubuntu matrix
  # step structure is untouched (zero regression risk to the required Linux
  # shards while we iterate on Windows-specific flake). p40 self-creates its
  # workspace (no fixtures artifact) and needs no extension bundle, so it
  # consumes only the cross-platform JS extension-build artifact. No
  # xvfb/apt/sudo/symlink here: windows-latest has a real interactive desktop
  # (ExTester drives VS Code directly) and actions/setup-node puts node on PATH
  # for the func-host child processes. `shell: bash` is used throughout because
  # windows-latest ships Git Bash + bsdtar, letting us reuse the same tar /
  # ${RUNNER_TEMP} idioms as the Linux jobs.
  vscode-e2e-windows:
    name: vscode-e2e-windows (${{ matrix.shard }})
    needs: setup-extension-build
    # Windows ExTester cold-start (real display, VS Code download, func host on
    # Windows) is materially slower than Linux xvfb; give generous headroom plus
    # room for one fresh-session retry (LA_E2E_SCENARIO_RETRIES).
    timeout-minutes: 45
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Activation smoke on a non-logic-app workspace: exercises extension
          # activation + command registration without needing dotnet, fixtures,
          # or the extension bundle. Ideal first Windows signal.
          - shard: activation-smoke
            scenario: p40-nonlogicapp
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Verify node on PATH (for func host child processes)
        run: |
          echo "node: $(command -v node) $(node --version)"
          echo "npm:  $(command -v npm)  $(npm --version)"
          echo "npx:  $(command -v npx)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      # RESTORE-ONLY (no save) — deliberate. This shard runs p40-nonlogicapp with
      # LA_E2E_BUNDLE_PREFLIGHT=0 and never hydrates runtime dependencies, so it has
      # nothing worth saving under the shared key that the codeful Windows job
      # depends on. `actions/cache@v5` only skips its post-save on an EXACT key hit
      # (see actions/cache saveImpl.ts) — a `restore-keys` PREFIX hit populates the
      # directory and then re-saves that stale tree onto `-v1`, and a poisoned entry
      # is unrecoverable because the codeful jobs' `cache-hit != 'true'` save guard
      # suppresses the repair. The ubuntu matrix is immune to this by ordering
      # (`needs: setup-fixtures` guarantees the hydrating job saves first); this job
      # runs in PARALLEL with setup-runtime-deps-windows for speed, so it gets the
      # same guarantee by never saving at all.
      # NOTE: `path`/`key`/`restore-keys` must stay byte-identical to the other
      # la-runtime-deps steps — actions/cache derives the cache entry *version* from
      # the path set, so editing it silently invalidates the existing entries.
      - name: Restore Logic Apps runtime dependencies
        uses: actions/cache/restore@v5
        with:
          # %USERPROFILE%\.azurelogicapps on Windows; ~ resolves correctly under
          # the job's bash shell.
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Run scenario (${{ matrix.shard }})
        run: |
          echo "PATH=$PATH"
          node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: ${{ matrix.scenario }}
          LA_E2E_BUNDLE_PREFLIGHT: '0'
          # Retry a failing scenario once in a fresh VS Code session to absorb
          # transient Windows launch/activation cold-start races. Non-masking.
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          # Pin os.tmpdir() so workspace + manifest creation lands under the
          # runner temp (matches the Linux jobs' RUNNER_TEMP layout).
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-windows-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage C: codeful debug (F5) as a first-class CI shard on BOTH OSes.
  #
  # Why this exists / why it wasn't here before: codeful debug is a bespoke
  # runCodefulDebugPhases() (run-e2e.ts) — it self-creates modern + legacy
  # codeful workspaces, patches the generated .csproj targets, installs a
  # task-recorder extension, and runs a create -> debug flow. It does NOT fit
  # the declarative scenarios[] table every other shard selects via
  # LA_E2E_SCENARIO, so no shard ever picked it up. It only ran via E2E_MODE=full
  # (local) or E2E_MODE=codefuldebugonly. We wire that self-contained mode in
  # directly here.
  #
  # The regression this guards (MSB3026: design-time func host locking
  # lib/codeful/*.dll during the F5 build) only reproduces on Windows, so
  # windows-latest is the true end-to-end guard. On ubuntu the assertion is the
  # cross-platform Option B signal — the codeful design-time local.settings.json
  # must select the Node worker (FUNCTIONS_WORKER_RUNTIME=node, no
  # FUNCTIONS_INPROC_NET8_ENABLED) so the host never loads/locks the codeful
  # assemblies — plus buildExit === 0.
  #
  # Needs the .NET 8 SDK on both OSes because F5 runs dotnet build/publish on the
  # net8 codeful project. Self-provisions its runtime dependencies + extension
  # bundle at run time (validateDependencies), so it consumes only the
  # cross-platform JS extension-build artifact — no fixtures / bundle artifact.
  # Codeful debug E2E (E2E_MODE=codefuldebugonly), the first-ever CI presence for this
  # suite (previously local-only). The test opens the generated .code-workspace after
  # launch via openWorkspaceFileInSession (ExTester's startup `resources` / `code -r` IPC
  # silently no-ops headlessly), then relies on onboarding auto-start to emit the
  # workflow-designtime evidence and asserts FUNCTIONS_WORKER_RUNTIME=node (the Option B
  # regression signal) plus the F5 build/task chain.
  #
  # Split into two independent single-OS jobs (rather than one matrix job) so each has an
  # unambiguous `result` the summary gate can key on. GitHub's matrix-aggregate result +
  # per-leg continue-on-error semantics are fuzzy — a separate job per OS keeps each leg
  # independently reportable and lets them be promoted to blocking one at a time.
  vscode-e2e-codeful-ubuntu:
    name: vscode-e2e-codeful (ubuntu-latest)
    needs: setup-extension-build
    # Exercises the codeful F5 debug path (workspace opens, design-time Node worker,
    # dotnet build, task chain).
    #
    # BLOCKING as of this PR — promoted from advisory.
    #
    # These legs landed advisory (continue-on-error) in #9463 because the F5 task-chain
    # assertions rode an unfixed Azurite startup race: `preDebugValidate` →
    # `validateEmulatorIsRunning` raced Azurite startup and popped the
    # headless-unanswerable "Failed to verify AzureWebJobsStorage connection" modal.
    # Because that modal is `modal: true`, the awaited `showWarningMessage` never
    # resolved, so `vscode.debug.startDebugging()` itself never settled. Proven
    # signature: a lone `debugStart` event with no `debugStarted`/`debugStartFailed`,
    # a 12-minute wait, `events captured=1`, buildStart:0. Byte-identical code produced
    # both green and red runs purely on that race.
    #
    # This PR removes the race at the source: `activateAzurite` now awaits
    # `waitForAzuriteReady()` — non-prompting readiness polling that throws a real error
    # instead of showing a modal — and it runs BEFORE `preDebugValidate`, so the modal
    # branch is unreachable. Phase 4.13 covers the failure mode directly by binding
    # Azurite's ports and asserting the modal never appears. `codefulDebugTasks` also
    # now fails fast if a debug start ever hangs again, instead of burning the timeout.
    #
    # With the race gone these legs are deterministic, so they are required checks again.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          if [ -d "$DEPS_DIR" ]; then
            echo "deps dir exists: $DEPS_DIR"
            du -sh "$DEPS_DIR" 2>/dev/null || true
            ls -la "$DEPS_DIR" || true
          else
            echo "deps dir MISSING (cold): $DEPS_DIR"
          fi

      - name: Run codeful debug
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "PATH=$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          E2E_MODE: codefuldebugonly
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      # `actions/cache@v5` is post-if: success(); saving explicitly keeps the Linux
      # cache fresh even on a red run. Guarded so a partial set is never persisted.
      - name: Verify hydrated runtime dependencies
        id: deps-check
        if: always()
        run: |
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          ok=true
          for d in FuncCoreTools DotNetSDK NodeJs; do
            if [ -d "$DEPS_DIR/$d" ]; then
              echo "present: $d"
            else
              echo "MISSING: $d"
              ok=false
            fi
          done
          FUNC_BIN="$(find "$DEPS_DIR/FuncCoreTools" -maxdepth 2 \( -name 'func' -o -name 'func.exe' \) -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$FUNC_BIN" ] && "$FUNC_BIN" --version; then
            echo "func is runnable: $FUNC_BIN"
          else
            echo "func did not run (existence is not enough)"
            ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Save Logic Apps runtime dependencies
        if: always() && steps.la-deps-cache.outputs.cache-hit != 'true' && steps.deps-check.outputs.ok == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-codeful-ubuntu-latest
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Azurite readiness regression guard (Phase 4.13).
  #
  # This is the direct regression test for the bug this PR fixes. Before the fix,
  # `preDebugValidate` -> `validateEmulatorIsRunning` could run while Azurite was
  # still starting; the blob probe threw and the catch branch awaited a
  # `modal: true` warning ("Failed to verify AzureWebJobsStorage connection").
  # Nothing can answer a modal headlessly, so the await never resolved and
  # `vscode.debug.startDebugging()` itself never settled — a lone `debugStart`
  # event, no `debugStarted`/`debugStartFailed`, and a 12-minute hang.
  #
  # Rather than hope for the race, Phase 4.13 FORCES it deterministically: the test
  # binds TCP 10000/10001/10002 so Azurite physically cannot start, then presses F5
  # and asserts (a) the new "Azurite did not become ready" error surfaces, (b) the
  # "Failed to verify AzureWebJobsStorage connection" modal never appears, (c) no
  # "Debug anyway" affordance appears, and (d) the debug toolbar is not shown.
  # Because the failure is forced rather than raced, this job is deterministic and
  # is gated in vscode-e2e-summary from the start.
  #
  # Restore-only cache: the Linux entry is kept warm by setup-fixtures and the
  # vscode-e2e scenario matrix, so this job never needs to save. That also avoids
  # adding another writer to `la-runtime-deps-Linux-v1`.
  vscode-e2e-azurite:
    name: vscode-e2e-azurite (ubuntu-latest)
    needs: setup-extension-build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      # The test binds 10000-10002 itself and fails loudly if it cannot. Assert the
      # ports are free up front so a pre-existing emulator on the image is reported
      # as an infrastructure problem rather than a product regression.
      - name: Verify Azurite ports are free
        run: |
          for port in 10000 10001 10002; do
            if ss -ltn "sport = :$port" | tail -n +2 | grep -q .; then
              echo "::error::Port $port is already in use; Phase 4.13 needs to bind it to simulate an unavailable Azurite."
              ss -ltnp "sport = :$port" || true
              exit 1
            fi
            echo "port $port: free"
          done

      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"

      - name: Run Azurite readiness E2E
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          E2E_MODE: azuriteonly
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-azurite
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows runtime-dependency bootstrap.
  #
  # Why this exists: `la-runtime-deps-Windows-*` could never be created, so every
  # Windows run started cold. Two facts composed to make it impossible:
  #
  #   1. No Windows job was designated to seed the cache. On ubuntu that role is
  #      played by `setup-fixtures` (LA_E2E_STRICT_DEPENDENCY_VALIDATION=1 forces
  #      the full FuncCoreTools + DotNetSDK + NodeJs hydration) and by the
  #      `vscode-e2e` scenario matrix — both download the deps AND pass, so they
  #      write `la-runtime-deps-Linux-v1` every run. Note that
  #      `vscode-e2e-codeful-ubuntu` only needs `setup-extension-build` too: it is
  #      green purely because those OTHER ubuntu jobs keep the cache warm for it.
  #      `setup-extension-build` is a cross-platform JS build whose only caches are
  #      turbo + pnpm — it never touches runtime deps.
  #   2. The one Windows job that DID download deps (codeful) could never save
  #      them, because `actions/cache@v5` declares `post-if: success()` and that
  #      job fails. The only passing Windows job (`vscode-e2e-windows`) runs the
  #      `p40-nonlogicapp` scenario, which by design needs no dotnet/fixtures/
  #      bundle, so its deps directory is empty and there is nothing to save.
  #
  # This job is the missing Windows counterpart to `setup-fixtures`: it hydrates
  # the dependencies and persists them with the restore/save pair (see below), so
  # `vscode-e2e-codeful-windows` — which `needs:` this job — restores a WARM cache
  # on the very first run.
  #
  # Advisory (continue-on-error) and deliberately NOT in the vscode-e2e-summary
  # hard gate. That is precisely why this is a NEW job rather than an extra shard
  # on `vscode-e2e-windows`, which IS gated.
  #
  # It stays advisory permanently, by design — this is a cache-SEEDING job. Once
  # la-runtime-deps-Windows-v1 exists it is refreshed on every access, so a
  # transient failure here still leaves the (now blocking) codeful leg with a warm
  # restore. Just as important: continue-on-error keeps this job's result
  # "success" for `needs:` purposes, so vscode-e2e-codeful-windows always RUNS
  # instead of being skipped — a skipped job would trip the summary gate's
  # != "success" check and fail the build for the wrong reason.
  setup-runtime-deps-windows:
    name: setup-runtime-deps (windows)
    needs: setup-extension-build
    continue-on-error: true
    timeout-minutes: 45
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      # restore/save pair instead of actions/cache@v5: the plain action is
      # `post-if: success()`, so a flaky hydration run would save nothing and leave
      # the cache empty forever. `if: always()` persists whatever was downloaded.
      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          if [ -d "$DEPS_DIR" ]; then
            echo "deps dir exists: $DEPS_DIR"
            du -sh "$DEPS_DIR" 2>/dev/null || true
            ls -la "$DEPS_DIR" || true
          else
            echo "deps dir MISSING (cold): $DEPS_DIR"
          fi

      - name: Hydrate Logic Apps runtime dependencies
        run: |
          echo "PATH=$PATH"
          node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: p41a-fixtures
          # Forces the full FuncCoreTools + DotNetSDK + NodeJs download instead of
          # letting validation short-circuit. Same switch setup-fixtures uses.
          LA_E2E_STRICT_DEPENDENCY_VALIDATION: '1'
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      # Guard against persisting a half-downloaded dependency set. A partial cache
      # is worse than none: it would restore as a HIT on every later run and never
      # be re-downloaded. If hydration did not yield a RUNNABLE func plus the
      # DotNetSDK/NodeJs roots, skip the save and stay cold instead.
      - name: Verify hydrated runtime dependencies
        id: deps-check
        if: always()
        run: |
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          ok=true
          for d in FuncCoreTools DotNetSDK NodeJs; do
            if [ -d "$DEPS_DIR/$d" ]; then
              echo "present: $d"
            else
              echo "MISSING: $d"
              ok=false
            fi
          done
          FUNC_BIN="$(find "$DEPS_DIR/FuncCoreTools" -maxdepth 2 \( -name 'func' -o -name 'func.exe' \) -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$FUNC_BIN" ] && "$FUNC_BIN" --version; then
            echo "func is runnable: $FUNC_BIN"
          else
            echo "func did not run (existence is not enough)"
            ok=false
          fi
          du -sh "$DEPS_DIR" 2>/dev/null || true
          ls -la "$DEPS_DIR" 2>/dev/null || true
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != "true" ]; then
            echo "::warning::Runtime dependency hydration incomplete - skipping cache save"
          fi

      - name: Save Logic Apps runtime dependencies
        if: always() && steps.la-deps-cache.outputs.cache-hit != 'true' && steps.deps-check.outputs.ok == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1

      - name: Upload bootstrap screenshots on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: vscode-e2e-screenshots-setup-runtime-deps-windows
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  vscode-e2e-codeful-windows:
    name: vscode-e2e-codeful (windows-latest)
    # Depends on the Windows runtime-dependency bootstrap so this job restores a
    # WARM la-runtime-deps-Windows-v1 cache instead of hydrating from cold.
    #
    # This leg used to fail 100% of the time with buildStart:0 / waitForTaskChain
    # timeout, which we wrongly attributed to Windows func-host provisioning. The
    # real cause was the cold cache: la-runtime-deps-Windows-v1 could never be
    # saved (no bootstrap job + actions/cache being post-if: success()), so every
    # run hydrated dependencies underneath the already-running test. With a warm
    # restore the full chain completes — buildStart:1/buildExit:0, publish and func
    # host all green — and `func --version` succeeds on the runner, so the "cannot
    # execute auto-provisioned func.exe" theory is disproven. That is what
    # setup-runtime-deps-windows below fixes, and it is a genuine win in this PR.
    #
    # BLOCKING as of this PR — promoted from advisory alongside the ubuntu leg above,
    # for the same reason: the Azurite readiness fix in this change set removes the
    # startup race that made the F5 task-chain assertions intermittently hang. See the
    # ubuntu leg for the full explanation of the race and the fix.
    needs: [setup-extension-build, setup-runtime-deps-windows]
