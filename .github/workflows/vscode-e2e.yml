name: VS Code Extension E2E Tests

on:
  push:
    branches: [main, dev/*, hotfix/*]
    paths:
      - 'apps/vs-code-designer/**'
      - 'apps/vs-code-react/**'
      - 'libs/vscode-extension/**'
      - 'libs/designer/**'
      - 'libs/designer-ui/**'
      - 'libs/designer-v2/**'
      - 'libs/logic-apps-shared/**'
      - 'libs/data-mapper-v2/**'
      - 'libs/data-mapper/**'
      - 'libs/chatbot/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vscode-e2e.yml'
  pull_request:
    branches: [main, dev/*, hotfix/*]
    paths:
      - 'apps/vs-code-designer/**'
      - 'apps/vs-code-react/**'
      - 'libs/vscode-extension/**'
      - 'libs/designer/**'
      - 'libs/designer-ui/**'
      - 'libs/designer-v2/**'
      - 'libs/logic-apps-shared/**'
      - 'libs/data-mapper-v2/**'
      - 'libs/data-mapper/**'
      - 'libs/chatbot/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vscode-e2e.yml'
  # Manual trigger so PR authors and chief-engineer agents can force a CI
  # re-run on the latest PR head (useful when path-filter coalescing
  # suppresses an expected auto-trigger after rapid pushes).
  workflow_dispatch:

concurrency:
  group: vscode-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the extension + compile the E2E test bundle ONCE per workflow run,
  # then fan out to the matrix shards which download the resulting artifact.
  # This eliminates ~3min of duplicated pnpm install + turbo build + tsup
  # work that previously ran on each of the 5 matrix shards in parallel.
  setup-extension-build:
    name: setup-extension-build
    runs-on: ubuntu-latest
    # ---------------------------------------------------------------------
    # Timeout policy for this workflow.
    #
    # A job timeout is a BACKSTOP against a wedged runner, not a performance
    # SLA. Sizing it to the worst observed run is actively harmful: these are
    # UI-driven ExTester jobs whose tails are long and legitimate. Measured over
    # 25 runs, `vscode-e2e (activation-and-create)` has a median of 3.9 min and a
    # worst HEALTHY run of 14.9 min — a 3.8x tail. A timeout set to "worst
    # observed" during a fast week would convert those slow-but-green runs into
    # red builds, which is the exact failure mode the hang-guard work in this PR
    # exists to eliminate.
    #
    # So each timeout below is ~2x the worst healthy observation, which also
    # absorbs the one fresh-session retry allowed by LA_E2E_SCENARIO_RETRIES,
    # and (for jobs that consume `la-runtime-deps`) a COLD cache — the Windows
    # bootstrap is continue-on-error, so its dependents must still fit when it
    # fails and they hydrate from scratch. Values are deliberately not tuned
    # below that, because the fast-failure signal lives in the in-test guards,
    # not here.
    #
    # Observed: max 3.2 min over 25 runs.
    # ---------------------------------------------------------------------
    timeout-minutes: 10
    outputs:
      build-artifact: extension-build-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          # Content-based key: hits across pushes that don't change source.
          # Previously keyed on github.sha which missed on every push.
          key: ${{ runner.os }}-turbo-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'libs/**/*.ts', 'libs/**/*.tsx', 'pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          # Mirrors the matrix-job symlink step. Kept here so any tooling
          # invoked during build (turbo, tsup) that shells out to /usr/bin/node
          # resolves correctly. The matrix shards re-do this on their own
          # runners because each matrix entry is an independent VM.
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Cache the pnpm content-addressed store so matrix shards can rehydrate
      # node_modules faster on warm runs. The setup-extension-build job warms
      # this cache by running a full install below; shards restore the cache
      # and pnpm reuses store entries while falling back to the network for
      # anything missing (no --offline strictness).
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Build extension
        run: pnpm turbo run build:extension --cache-dir=.turbo

      - name: Compile ExTester E2E tests
        working-directory: apps/vs-code-designer
        run: npx tsup --config tsup.e2e.test.config.ts

      - name: Compile @vscode/test-cli E2E tests
        working-directory: apps/vs-code-designer
        run: pnpm run test:e2e-cli:compile

      - name: Tar build artifacts
        # Tar preserves symlinks/permissions and dramatically speeds upload
        # vs uploading thousands of small files in node_modules-adjacent dirs.
        run: |
          tar -czf extension-build.tar.gz \
            apps/vs-code-designer/dist/ \
            apps/vs-code-designer/out/ \
            $(find apps/vs-code-designer/node_modules/.cache -maxdepth 0 -type d 2>/dev/null)

      - name: Upload extension build artifact
        uses: actions/upload-artifact@v6
        with:
          name: extension-build-${{ github.sha }}
          path: extension-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Run the fixtures-only scenario (p41a) ONCE per workflow run. Uploads
  # the resulting workspace tree + created-workspaces.json manifest so the
  # downstream per-scenario matrix shards can hydrate them instead of
  # paying the wizard-driven workspace creation cost on every shard.
  setup-fixtures:
    name: setup-fixtures (p41a)
    needs: setup-extension-build
    runs-on: ubuntu-latest
    # Headroom for one fresh-session retry (LA_E2E_SCENARIO_RETRIES) if the
    # fixtures scenario flakes, so the retry isn't killed mid-run.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      - name: Cache Logic Apps runtime dependencies
        uses: actions/cache@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Run fixtures scenario (p41a-fixtures)
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: p41a-fixtures
          LA_E2E_STRICT_DEPENDENCY_VALIDATION: '1'
          # Retry a flaky fixtures run once in a fresh session before failing the
          # setup job (which would block every downstream shard). Non-masking: a
          # genuine failure still goes red after the retry.
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          # Node's os.tmpdir() honors TMPDIR/TMP/TEMP on Linux; setting TEMP
          # pins workspace + manifest creation under $RUNNER_TEMP/la-e2e-test
          # so the artifact upload below has a stable, scoped path.
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Verify Logic Apps extension bundle sidecar
        run: |
          BUNDLE_ROOT="${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle.Workflows"
          node - "$BUNDLE_ROOT" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2];
          if (!fs.existsSync(root)) {
            throw new Error(`Bundle root missing: ${root}`);
          }
          const versions = fs.readdirSync(root)
            .filter((name) => /^\d+\.\d+\.\d+/.test(name) && fs.statSync(path.join(root, name)).isDirectory())
            .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
          if (versions.length === 0) {
            throw new Error(`No bundle version folders under ${root}`);
          }
          const bundleDir = path.join(root, versions[0]);
          const sidecarPath = path.join(bundleDir, '.bundle-source-md5');
          if (!fs.existsSync(sidecarPath)) {
            throw new Error(`Bundle sidecar missing: ${sidecarPath}`);
          }
          const sidecar = JSON.parse(fs.readFileSync(sidecarPath, 'utf8'));
          if (!sidecar || typeof sidecar.sourceMd5 !== 'string' || typeof sidecar.contentHash !== 'string') {
            throw new Error(`Bundle sidecar missing sourceMd5/contentHash: ${sidecarPath}`);
          }
          const entries = fs.readdirSync(bundleDir).filter((name) => name !== '.bundle-source-md5');
          if (entries.length === 0) {
            throw new Error(`Bundle directory has no extracted content: ${bundleDir}`);
          }
          console.log(`Bundle verified: ${bundleDir}`);
          console.log(`Sidecar: ${sidecarPath}`);
          NODE

      - name: Verify fixtures manifest exists
        run: |
          MANIFEST="${RUNNER_TEMP}/la-e2e-test/created-workspaces.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Fixtures manifest missing at $MANIFEST"
            ls -la "${RUNNER_TEMP}/la-e2e-test" || true
            exit 1
          fi
          echo "Manifest contents:"
          cat "$MANIFEST"

      - name: Tar created workspaces + manifest
        run: |
          tar -czf workspace-fixtures.tar.gz -C "${RUNNER_TEMP}" la-e2e-test

      - name: Tar Logic Apps extension bundle
        run: |
          tar -czf logic-apps-extension-bundle.tar.gz \
            -C "${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles" \
            Microsoft.Azure.Functions.ExtensionBundle.Workflows

      - name: Upload workspace fixtures artifact
        uses: actions/upload-artifact@v6
        with:
          name: workspace-fixtures-${{ github.sha }}
          path: workspace-fixtures.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload Logic Apps extension bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: logic-apps-extension-bundle-${{ github.sha }}
          path: logic-apps-extension-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload fixture screenshots on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: vscode-e2e-screenshots-setup-fixtures
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  vscode-e2e:
    name: vscode-e2e (${{ matrix.shard }})
    needs: [setup-extension-build, setup-fixtures]
    # Grouped shards run scenarios sequentially and each failing scenario may
    # retry once in a fresh session (LA_E2E_SCENARIO_RETRIES). 35m gives the
    # heaviest group room for a retry without a timeout-induced failure.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Scenarios are grouped onto fewer runners to amortize the fixed CI
          # setup cost (pnpm install, node symlink, xvfb apt-get, artifact
          # download/extract, bundle + fixtures hydration) that each shard pays
          # once. `scenario` is a comma-separated list consumed by
          # LA_E2E_SCENARIO; run-e2e.js runs each entry in its OWN fresh VS Code
          # session (prepareFreshSession kills lingering processes between
          # scenarios), so grouping preserves per-scenario isolation — it is NOT
          # the flaky "multiple tests in one window" pattern. A failing scenario
          # still runs its siblings and fails the shard (aggregate = max exit).
          # use_* flags are the union of the group's needs.
          #
          # Extension activation smoke (p40) + create-a-project-for-conversion
          # (p48b). Grouped because both are fixture-independent and self-create
          # any workspace they need.
          - shard: activation-and-create
            scenario: p40-nonlogicapp,p48b-conversioncreate
            use_workspace_fixtures: false
            use_bundle_artifact: false
          # Full 12-shape workspace-creation wizard validation — self-creates its
          # own workspaces, so it doesn't consume the fixtures artifact, but it
          # still consumes the setup-fixtures bundle artifact and runs bundle
          # preflight. Kept on its own shard because it is the heaviest scenario.
          - shard: workspace-creation
            scenario: p41b-createworkspace-behavior
            use_workspace_fixtures: false
            use_bundle_artifact: true
          # Designer open → edit → save → debug → run lifecycle across app types.
          - shard: designer-lifecycle
            scenario: p42-standard,p42-customcode,p42-rulesengine
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Runtime-touching action tests (execute code / rules engine).
          - shard: runtime-actions
            scenario: p43-inlinejavascript,p43-customcode,p43-rulesengine
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Designer editing interactions: variables, extended view (parallel
          # branches / run-after), keyboard navigation.
          - shard: designer-interactions
            scenario: p44-statelessvariables,p45-designerviewextended,p46-keyboardnav,p49-descriptionpersistence
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # NuGet debug lifecycle regression: bundle debug/run -> convert to
          # NuGet -> debug/run again without harness port cleanup.
          - shard: nuget-debug-lifecycle
            scenario: p49-nugetdebugconversion
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Multi-designer + dataMapper suite (manifest-multi) + bundle repair.
          - shard: suite-and-bundle
            scenario: p47-suite,p412-bundlerepair
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Func Core Tools pre-debug self-heal. Own shard on purpose: it is the
          # only scenario that downloads the Func Core Tools package twice (the
          # initial managed install, then the repair after it is corrupted), so
          # its wall time is dominated by network and would put a retried
          # suite-and-bundle over this job's 35 min budget.
          - shard: func-selfheal
            scenario: p414-funcrepair
            use_workspace_fixtures: true
            use_bundle_artifact: true
          # Legacy project → workspace conversion variants.
          - shard: project-conversion
            scenario: p48a-conversionno,p48c-multipledesigners,p48d-conversionyes,p48e-conversionsubfolder
            use_workspace_fixtures: true
            use_bundle_artifact: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          # See setup-extension-build for the rationale. The Functions host
          # spawned by xvfb-run -> VS Code -> extension does not inherit the
          # workflow PATH from actions/setup-node, so we symlink into
          # /usr/bin and /usr/local/bin where any sanitized PATH will find it.
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done
          echo "Symlinked node $(node --version) into /usr/local/bin and /usr/bin"
          env -i /usr/bin/node --version

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      # Scenarios that self-create their workspaces set use_workspace_fixtures=false.
      - name: Download workspace fixtures artifact
        if: matrix.use_workspace_fixtures == true
        uses: actions/download-artifact@v7
        with:
          name: workspace-fixtures-${{ github.sha }}
          path: .

      - name: Extract workspace fixtures into $RUNNER_TEMP
        if: matrix.use_workspace_fixtures == true
        run: |
          mkdir -p "${RUNNER_TEMP}"
          tar -xzf workspace-fixtures.tar.gz -C "${RUNNER_TEMP}"
          echo "Extracted fixtures:"
          ls -la "${RUNNER_TEMP}/la-e2e-test" || true
          if [ -f "${RUNNER_TEMP}/la-e2e-test/created-workspaces.json" ]; then
            echo "Manifest:"
            cat "${RUNNER_TEMP}/la-e2e-test/created-workspaces.json"
          fi

      - name: Download Logic Apps extension bundle artifact
        if: matrix.use_bundle_artifact == true
        uses: actions/download-artifact@v7
        with:
          name: logic-apps-extension-bundle-${{ github.sha }}
          path: .

      - name: Extract Logic Apps extension bundle
        if: matrix.use_bundle_artifact == true
        run: |
          mkdir -p "${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles"
          tar -xzf logic-apps-extension-bundle.tar.gz -C "${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles"
          find "${HOME}/.azure-functions-core-tools/Functions/ExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle.Workflows" -maxdepth 2 -type f -name '.bundle-source-md5' -print

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      - name: Cache Logic Apps runtime dependencies
        uses: actions/cache@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Run scenario group (${{ matrix.shard }})
        # Each shard runs one or more scenarios (comma-separated in
        # matrix.scenario) sequentially, each in its own fresh VS Code session.
        # Phase 4.1 (commits 2672168f7 + d866b3368) targeted the historically-
        # flaky scenarios (p42-standard, p42-customcode, p42-rulesengine,
        # p46-keyboardnav, p47-suite) at the root cause, and added a focus-reset
        # for the pre-existing p48d-conversionyes xvfb race.
        #
        # continue-on-error stays off so any future regression is surfaced as a
        # job-level failure (no longer masked). Flake closure gating is
        # structural: a red shard fails the workflow. run-e2e.js aggregates
        # exit = max across the group, so a failing scenario still runs its
        # siblings and fails the shard, and the failure mode + CI diff are
        # visible immediately instead of hidden behind allowFailure.
        run: |
          # Belt-and-suspenders PATH export (see grouped-shard rationale in git history).
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "PATH=$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          # Grouped matrix: each shard runs one or more scenarios[] entries.
          LA_E2E_SCENARIO: ${{ matrix.scenario }}
          LA_E2E_BUNDLE_PREFLIGHT: ${{ matrix.use_bundle_artifact && '1' || '0' }}
          # Retry a failing scenario once in a fresh VS Code session to absorb
          # transient xvfb/focus/cold-start races. Non-masking: a scenario that
          # fails both attempts still fails the shard; a retry-to-pass is logged
          # as a `::warning::` flake so the race can still be root-caused.
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          # Pin os.tmpdir() so the bootstrapper finds the manifest the
          # setup-fixtures job uploaded (same RUNNER_TEMP layout).
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage B beachhead (Windows parity): prove the windows-latest toolchain on
  # ONE cheap, high-signal scenario (p40 activation smoke) before fanning
  # windows-latest out across the full matrix (Stage D). Kept as a DEDICATED
  # job — not a `matrix.os` entry on vscode-e2e — so the existing ubuntu matrix
  # step structure is untouched (zero regression risk to the required Linux
  # shards while we iterate on Windows-specific flake). p40 self-creates its
  # workspace (no fixtures artifact) and needs no extension bundle, so it
  # consumes only the cross-platform JS extension-build artifact. No
  # xvfb/apt/sudo/symlink here: windows-latest has a real interactive desktop
  # (ExTester drives VS Code directly) and actions/setup-node puts node on PATH
  # for the func-host child processes. `shell: bash` is used throughout because
  # windows-latest ships Git Bash + bsdtar, letting us reuse the same tar /
  # ${RUNNER_TEMP} idioms as the Linux jobs.
  vscode-e2e-windows:
    name: vscode-e2e-windows (${{ matrix.shard }})
    needs: setup-extension-build
    # Windows ExTester cold-start (real display, VS Code download, func host on
    # Windows) is materially slower than Linux xvfb; give headroom plus room for
    # one fresh-session retry (LA_E2E_SCENARIO_RETRIES).
    # Observed: max 5.9 min over 16 runs. See the timeout policy on
    # setup-extension-build.
    timeout-minutes: 20
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Activation smoke on a non-logic-app workspace: exercises extension
          # activation + command registration without needing dotnet, fixtures,
          # or the extension bundle. Ideal first Windows signal.
          - shard: activation-smoke
            scenario: p40-nonlogicapp
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Verify node on PATH (for func host child processes)
        run: |
          echo "node: $(command -v node) $(node --version)"
          echo "npm:  $(command -v npm)  $(npm --version)"
          echo "npx:  $(command -v npx)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      # RESTORE-ONLY (no save) — deliberate. This shard runs p40-nonlogicapp with
      # LA_E2E_BUNDLE_PREFLIGHT=0 and never hydrates runtime dependencies, so it has
      # nothing worth saving under the shared key that the codeful Windows job
      # depends on. `actions/cache@v5` only skips its post-save on an EXACT key hit
      # (see actions/cache saveImpl.ts) — a `restore-keys` PREFIX hit populates the
      # directory and then re-saves that stale tree onto `-v1`, and a poisoned entry
      # is unrecoverable because the codeful jobs' `cache-hit != 'true'` save guard
      # suppresses the repair. The ubuntu matrix is immune to this by ordering
      # (`needs: setup-fixtures` guarantees the hydrating job saves first); this job
      # runs in PARALLEL with setup-runtime-deps-windows for speed, so it gets the
      # same guarantee by never saving at all.
      # NOTE: `path`/`key`/`restore-keys` must stay byte-identical to the other
      # la-runtime-deps steps — actions/cache derives the cache entry *version* from
      # the path set, so editing it silently invalidates the existing entries.
      - name: Restore Logic Apps runtime dependencies
        uses: actions/cache/restore@v5
        with:
          # %USERPROFILE%\.azurelogicapps on Windows; ~ resolves correctly under
          # the job's bash shell.
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Run scenario (${{ matrix.shard }})
        run: |
          echo "PATH=$PATH"
          node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: ${{ matrix.scenario }}
          LA_E2E_BUNDLE_PREFLIGHT: '0'
          # Retry a failing scenario once in a fresh VS Code session to absorb
          # transient Windows launch/activation cold-start races. Non-masking.
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          # Pin os.tmpdir() so workspace + manifest creation lands under the
          # runner temp (matches the Linux jobs' RUNNER_TEMP layout).
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-windows-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # @vscode/test-cli Create Workspace parity visibility.
  #
  # This is additive to the ExTester matrix above: ExTester remains the owner for
  # full designer/wizard DOM coverage and the VS Code 1.108.0 compatibility pin
  # below remains unchanged. These matrix legs exercise the official
  # @vscode/test-cli baseline against focused Create Workspace labels so PR CI
  # can see latest-stable VS Code extension-host parity without serializing the
  # whole suite into one hard-to-diagnose run.
  #
  # Intentionally excluded from PR CI for now: workspaceLifecycle. That target
  # creates workspaces, reopens generated app folders, opens designer webviews,
  # builds .NET projects, starts Azurite/runtime, runs triggers, and validates
  # Overview results. Keep it as an explicit/manual script until its runtime cost
  # and flake profile justify becoming a PR gate.
  vscode-e2e-cli-create-workspace:
    name: vscode-e2e-cli-create-workspace (${{ matrix.label }})
    needs: setup-extension-build
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: createWorkspaceBehavior
          - label: createWorkspaceCoreMatrix
          - label: createWorkspacePreviewMatrix
          - label: createWorkspaceCodeful
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      - name: Run @vscode/test-cli Create Workspace label (${{ matrix.label }})
        id: run_cli_create_workspace_label
        working-directory: apps/vs-code-designer
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "PATH=$PATH"
          mkdir -p .vscode-test/results
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            pnpm exec node scripts/run-e2e-cli.js --label "${{ matrix.label }}" 2>&1 | tee ".vscode-test/results/${{ matrix.label }}.log"
          status=${PIPESTATUS[0]}
          set -e
          outcome="success"
          if [ "$status" -ne 0 ]; then
            outcome="failure"
          fi
          node scripts/summarize-e2e-cli-results.js \
            --label "${{ matrix.label }}" \
            --log ".vscode-test/results/${{ matrix.label }}.log" \
            --out-dir ".vscode-test/results" \
            --outcome "$outcome"
          exit "$status"
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Summarize @vscode/test-cli Create Workspace result
        if: always()
        working-directory: apps/vs-code-designer
        run: |
          node scripts/summarize-e2e-cli-results.js \
            --append-summary \
            --json ".vscode-test/results/${{ matrix.label }}.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload CLI structured results (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-cli-test-results-${{ matrix.label }}
          path: |
            apps/vs-code-designer/.vscode-test/results/${{ matrix.label }}.json
            apps/vs-code-designer/.vscode-test/results/${{ matrix.label }}.junit.xml
            apps/vs-code-designer/.vscode-test/results/${{ matrix.label }}.summary.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload CLI screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-cli-screenshots-${{ matrix.label }}
          path: apps/vs-code-designer/.vscode-test/screenshots/cli/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload CLI test log (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-cli-log-${{ matrix.label }}
          path: apps/vs-code-designer/.vscode-test/results/${{ matrix.label }}.log
          if-no-files-found: ignore
          retention-days: 30

  vscode-e2e-cli-create-workspace-report:
    name: vscode-e2e-cli-create-workspace-report
    needs: vscode-e2e-cli-create-workspace
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download structured CLI results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: vscode-e2e-cli-test-results-*
          path: apps/vs-code-designer/.vscode-test/results/aggregate-input
          merge-multiple: true

      - name: Summarize aggregate @vscode/test-cli Create Workspace results
        run: |
          node apps/vs-code-designer/scripts/summarize-e2e-cli-results.js \
            --aggregate \
            --results-dir apps/vs-code-designer/.vscode-test/results/aggregate-input \
            --out-dir apps/vs-code-designer/.vscode-test/results/aggregate \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate CLI result dashboard
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-cli-test-results-summary
          path: apps/vs-code-designer/.vscode-test/results/aggregate/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage C: codeful debug (F5) as a first-class CI shard on BOTH OSes.
  #
  # Why this exists / why it wasn't here before: codeful debug is a bespoke
  # runCodefulDebugPhases() (run-e2e.ts) — it self-creates modern + legacy
  # codeful workspaces, patches the generated .csproj targets, installs a
  # task-recorder extension, and runs a create -> debug flow. It does NOT fit
  # the declarative scenarios[] table every other shard selects via
  # LA_E2E_SCENARIO, so no shard ever picked it up. It only ran via E2E_MODE=full
  # (local) or E2E_MODE=codefuldebugonly. We wire that self-contained mode in
  # directly here.
  #
  # The regression this guards (MSB3026: design-time func host locking
  # lib/codeful/*.dll during the F5 build) only reproduces on Windows, so
  # windows-latest is the true end-to-end guard. On ubuntu the assertion is the
  # cross-platform Option B signal — the codeful design-time local.settings.json
  # must select the Node worker (FUNCTIONS_WORKER_RUNTIME=node, no
  # FUNCTIONS_INPROC_NET8_ENABLED) so the host never loads/locks the codeful
  # assemblies — plus buildExit === 0.
  #
  # Needs the .NET 8 SDK on both OSes because F5 runs dotnet build/publish on the
  # net8 codeful project. Self-provisions its runtime dependencies + extension
  # bundle at run time (validateDependencies), so it consumes only the
  # cross-platform JS extension-build artifact — no fixtures / bundle artifact.
  # Codeful debug E2E (E2E_MODE=codefuldebugonly), the first-ever CI presence for this
  # suite (previously local-only). The test opens the generated .code-workspace after
  # launch via openWorkspaceFileInSession (ExTester's startup `resources` / `code -r` IPC
  # silently no-ops headlessly), then relies on onboarding auto-start to emit the
  # workflow-designtime evidence and asserts FUNCTIONS_WORKER_RUNTIME=node (the Option B
  # regression signal) plus the F5 build/task chain.
  #
  # Split into two independent single-OS jobs (rather than one matrix job) so each has an
  # unambiguous `result` the summary gate can key on. GitHub's matrix-aggregate result +
  # per-leg continue-on-error semantics are fuzzy — a separate job per OS keeps each leg
  # independently reportable and lets them be promoted to blocking one at a time.
  vscode-e2e-codeful-ubuntu:
    name: vscode-e2e-codeful (ubuntu-latest)
    needs: setup-extension-build
    # Exercises the codeful F5 debug path (workspace opens, design-time Node worker,
    # dotnet build, task chain).
    #
    # BLOCKING as of this PR — promoted from advisory.
    #
    # These legs landed advisory (continue-on-error) in #9463 because the F5 task-chain
    # assertions rode an unfixed Azurite startup race: `preDebugValidate` →
    # `validateEmulatorIsRunning` raced Azurite startup and popped the
    # headless-unanswerable "Failed to verify AzureWebJobsStorage connection" modal.
    # Because that modal is `modal: true`, the awaited `showWarningMessage` never
    # resolved, so `vscode.debug.startDebugging()` itself never settled. Proven
    # signature: a lone `debugStart` event with no `debugStarted`/`debugStartFailed`,
    # a 12-minute wait, `events captured=1`, buildStart:0. Byte-identical code produced
    # both green and red runs purely on that race.
    #
    # This PR removes the race at the source: `activateAzurite` now awaits
    # `waitForAzuriteReady()` — non-prompting readiness polling that throws a real error
    # instead of showing a modal — and it runs BEFORE `preDebugValidate`, so the modal
    # branch is unreachable. Phase 4.13 covers the failure mode directly by binding
    # Azurite's ports and asserting the modal never appears. `codefulDebugTasks` also
    # now fails fast if a debug start ever hangs again, instead of burning the timeout.
    #
    # With the race gone these legs are deterministic, so they are required checks again.
    # Observed: max 8.8 min over 13 runs. Sized to absorb one retry plus a cold
    # `la-runtime-deps-Linux` hydration. See the policy on setup-extension-build.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          if [ -d "$DEPS_DIR" ]; then
            echo "deps dir exists: $DEPS_DIR"
            du -sh "$DEPS_DIR" 2>/dev/null || true
            ls -la "$DEPS_DIR" || true
          else
            echo "deps dir MISSING (cold): $DEPS_DIR"
          fi

      - name: Run codeful debug
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "PATH=$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          E2E_MODE: codefuldebugonly
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      # `actions/cache@v5` is post-if: success(); saving explicitly keeps the Linux
      # cache fresh even on a red run. Guarded so a partial set is never persisted.
      - name: Verify hydrated runtime dependencies
        id: deps-check
        if: always()
        run: |
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          ok=true
          for d in FuncCoreTools DotNetSDK NodeJs; do
            if [ -d "$DEPS_DIR/$d" ]; then
              echo "present: $d"
            else
              echo "MISSING: $d"
              ok=false
            fi
          done
          FUNC_BIN="$(find "$DEPS_DIR/FuncCoreTools" -maxdepth 2 \( -name 'func' -o -name 'func.exe' \) -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$FUNC_BIN" ] && "$FUNC_BIN" --version; then
            echo "func is runnable: $FUNC_BIN"
          else
            echo "func did not run (existence is not enough)"
            ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Save Logic Apps runtime dependencies
        if: always() && steps.la-deps-cache.outputs.cache-hit != 'true' && steps.deps-check.outputs.ok == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-codeful-ubuntu-latest
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Azurite readiness regression guard (Phase 4.13).
  #
  # This is the direct regression test for the bug this PR fixes. Before the fix,
  # `preDebugValidate` -> `validateEmulatorIsRunning` could run while Azurite was
  # still starting; the blob probe threw and the catch branch awaited a
  # `modal: true` warning ("Failed to verify AzureWebJobsStorage connection").
  # Nothing can answer a modal headlessly, so the await never resolved and
  # `vscode.debug.startDebugging()` itself never settled — a lone `debugStart`
  # event, no `debugStarted`/`debugStartFailed`, and a 12-minute hang.
  #
  # Rather than hope for the race, Phase 4.13 FORCES it deterministically: the test
  # binds TCP 10000/10001/10002 so Azurite physically cannot start, then presses F5
  # and asserts (a) the new "Azurite did not become ready" error surfaces, (b) the
  # "Failed to verify AzureWebJobsStorage connection" modal never appears, (c) no
  # "Debug anyway" affordance appears, and (d) the debug toolbar is not shown.
  # Because the failure is forced rather than raced, this job is deterministic and
  # is gated in vscode-e2e-summary from the start.
  #
  # Restore-only cache: the Linux entry is kept warm by setup-fixtures and the
  # vscode-e2e scenario matrix, so this job never needs to save. That also avoids
  # adding another writer to `la-runtime-deps-Linux-v1`.
  vscode-e2e-azurite:
    name: vscode-e2e-azurite (ubuntu-latest, ${{ matrix.kind }})
    needs: setup-extension-build
    # 45 min to match the codeful legs. Phase 4.13A now gates on extension readiness
    # and runtime-dependency settling before it touches the command palette (up to
    # ~8 min on a cold runner, since `la-runtime-deps-Linux-*` may not be warm for
    # this job yet), and 4.13B waits up to 180 s for design-time plus the F5 assertions.
    # Observed: max 6.6 min across the ubuntu azurite legs. Sized to absorb one
    # retry plus a cold hydration. See the policy on setup-extension-build.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Sharded by app kind rather than looping both kinds in one job. Two reasons:
    # keeping wall-clock at the ~5 min single-kind baseline instead of doubling the
    # critical path, and making a failure name the kind that broke instead of
    # requiring a log dig. Matrix legs roll up into a single `needs.<job>.result`,
    # so the summary gate needs no extra entries.
    strategy:
      fail-fast: false
      matrix:
        kind: [codeless, codeful]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Symlink node to system path (for func host child processes)
        run: |
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      # The test binds 10000-10002 itself and fails loudly if it cannot. Assert the
      # ports are free up front so a pre-existing emulator on the image is reported
      # as an infrastructure problem rather than a product regression.
      - name: Verify Azurite ports are free
        run: |
          for port in 10000 10001 10002; do
            if ss -ltn "sport = :$port" | tail -n +2 | grep -q .; then
              echo "::error::Port $port is already in use; Phase 4.13 needs to bind it to simulate an unavailable Azurite."
              ss -ltnp "sport = :$port" || true
              exit 1
            fi
            echo "port $port: free"
          done

      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"

      - name: Run Azurite readiness E2E
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          E2E_MODE: azuriteonly
          AZURITE_E2E_APP_KINDS: ${{ matrix.kind }}
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-azurite-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows runtime-dependency bootstrap.
  #
  # Why this exists: `la-runtime-deps-Windows-*` could never be created, so every
  # Windows run started cold. Two facts composed to make it impossible:
  #
  #   1. No Windows job was designated to seed the cache. On ubuntu that role is
  #      played by `setup-fixtures` (LA_E2E_STRICT_DEPENDENCY_VALIDATION=1 forces
  #      the full FuncCoreTools + DotNetSDK + NodeJs hydration) and by the
  #      `vscode-e2e` scenario matrix — both download the deps AND pass, so they
  #      write `la-runtime-deps-Linux-v1` every run. Note that
  #      `vscode-e2e-codeful-ubuntu` only needs `setup-extension-build` too: it is
  #      green purely because those OTHER ubuntu jobs keep the cache warm for it.
  #      `setup-extension-build` is a cross-platform JS build whose only caches are
  #      turbo + pnpm — it never touches runtime deps.
  #   2. The one Windows job that DID download deps (codeful) could never save
  #      them, because `actions/cache@v5` declares `post-if: success()` and that
  #      job fails. The only passing Windows job (`vscode-e2e-windows`) runs the
  #      `p40-nonlogicapp` scenario, which by design needs no dotnet/fixtures/
  #      bundle, so its deps directory is empty and there is nothing to save.
  #
  # This job is the missing Windows counterpart to `setup-fixtures`: it hydrates
  # the dependencies and persists them with the restore/save pair (see below), so
  # `vscode-e2e-codeful-windows` — which `needs:` this job — restores a WARM cache
  # on the very first run.
  #
  # Advisory (continue-on-error) and deliberately NOT in the vscode-e2e-summary
  # hard gate. That is precisely why this is a NEW job rather than an extra shard
  # on `vscode-e2e-windows`, which IS gated.
  #
  # It stays advisory permanently, by design — this is a cache-SEEDING job. Once
  # la-runtime-deps-Windows-v1 exists it is refreshed on every access, so a
  # transient failure here still leaves the (now blocking) codeful leg with a warm
  # restore. Just as important: continue-on-error keeps this job's result
  # "success" for `needs:` purposes, so vscode-e2e-codeful-windows always RUNS
  # instead of being skipped — a skipped job would trip the summary gate's
  # != "success" check and fail the build for the wrong reason.
  setup-runtime-deps-windows:
    name: setup-runtime-deps (windows)
    needs: setup-extension-build
    # WARNING: `continue-on-error` makes `needs.<job>.result` evaluate to "success"
    # even when the job's conclusion is failure (observed in run 30146114725). It is
    # therefore only safe on a job that the summary gate does NOT check. This job is
    # deliberately absent from the gate's `!= "success"` chain below. Never add
    # `continue-on-error` to a gated job — it would silently green the whole build.
    continue-on-error: true
    # Observed: max 11.3 min over 16 runs. This job IS the cold-download path, so
    # network variance is inherent. See the policy on setup-extension-build.
    timeout-minutes: 25
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      # restore/save pair instead of actions/cache@v5: the plain action is
      # `post-if: success()`, so a flaky hydration run would save nothing and leave
      # the cache empty forever. `if: always()` persists whatever was downloaded.
      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          if [ -d "$DEPS_DIR" ]; then
            echo "deps dir exists: $DEPS_DIR"
            du -sh "$DEPS_DIR" 2>/dev/null || true
            ls -la "$DEPS_DIR" || true
          else
            echo "deps dir MISSING (cold): $DEPS_DIR"
          fi

      - name: Hydrate Logic Apps runtime dependencies
        run: |
          echo "PATH=$PATH"
          node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: p41a-fixtures
          # Forces the full FuncCoreTools + DotNetSDK + NodeJs download instead of
          # letting validation short-circuit. Same switch setup-fixtures uses.
          LA_E2E_STRICT_DEPENDENCY_VALIDATION: '1'
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      # Guard against persisting a half-downloaded dependency set. A partial cache
      # is worse than none: it would restore as a HIT on every later run and never
      # be re-downloaded. If hydration did not yield a RUNNABLE func plus the
      # DotNetSDK/NodeJs roots, skip the save and stay cold instead.
      - name: Verify hydrated runtime dependencies
        id: deps-check
        if: always()
        run: |
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          ok=true
          for d in FuncCoreTools DotNetSDK NodeJs; do
            if [ -d "$DEPS_DIR/$d" ]; then
              echo "present: $d"
            else
              echo "MISSING: $d"
              ok=false
            fi
          done
          FUNC_BIN="$(find "$DEPS_DIR/FuncCoreTools" -maxdepth 2 \( -name 'func' -o -name 'func.exe' \) -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$FUNC_BIN" ] && "$FUNC_BIN" --version; then
            echo "func is runnable: $FUNC_BIN"
          else
            echo "func did not run (existence is not enough)"
            ok=false
          fi
          du -sh "$DEPS_DIR" 2>/dev/null || true
          ls -la "$DEPS_DIR" 2>/dev/null || true
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != "true" ]; then
            echo "::warning::Runtime dependency hydration incomplete - skipping cache save"
          fi

      - name: Save Logic Apps runtime dependencies
        if: always() && steps.la-deps-cache.outputs.cache-hit != 'true' && steps.deps-check.outputs.ok == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1

      - name: Upload bootstrap screenshots on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: vscode-e2e-screenshots-setup-runtime-deps-windows
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  vscode-e2e-codeful-windows:
    name: vscode-e2e-codeful (windows-latest)
    # Depends on the Windows runtime-dependency bootstrap so this job restores a
    # WARM la-runtime-deps-Windows-v1 cache instead of hydrating from cold.
    #
    # This leg used to fail 100% of the time with buildStart:0 / waitForTaskChain
    # timeout, which we wrongly attributed to Windows func-host provisioning. The
    # real cause was the cold cache: la-runtime-deps-Windows-v1 could never be
    # saved (no bootstrap job + actions/cache being post-if: success()), so every
    # run hydrated dependencies underneath the already-running test. With a warm
    # restore the full chain completes — buildStart:1/buildExit:0, publish and func
    # host all green — and `func --version` succeeds on the runner, so the "cannot
    # execute auto-provisioned func.exe" theory is disproven. That is what
    # setup-runtime-deps-windows below fixes, and it is a genuine win in this PR.
    #
    # BLOCKING as of this PR — promoted from advisory alongside the ubuntu leg above,
    # for the same reason: the Azurite readiness fix in this change set removes the
    # startup race that made the F5 task-chain assertions intermittently hang. See the
    # ubuntu leg for the full explanation of the race and the fix.
    needs: [setup-extension-build, setup-runtime-deps-windows]
    # Observed: max 12.8 min over 6 runs — the slowest gated job in the workflow.
    # Kept at 35 because 2x the worst run is already 25.6 min, and this leg must
    # still fit when setup-runtime-deps-windows fails and it hydrates cold.
    # See the policy on setup-extension-build.
    timeout-minutes: 35
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Verify node on PATH (for func host child processes)
        run: |
          echo "node: $(command -v node) $(node --version)"
          echo "npm:  $(command -v npm)  $(npm --version)"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          if [ -d "$DEPS_DIR" ]; then
            echo "deps dir exists: $DEPS_DIR"
            du -sh "$DEPS_DIR" 2>/dev/null || true
            ls -la "$DEPS_DIR" || true
          else
            echo "deps dir MISSING (cold): $DEPS_DIR"
          fi

      - name: Run codeful debug
        run: |
          echo "PATH=$PATH"
          node apps/vs-code-designer/out/test/run-e2e.js
        env:
          E2E_MODE: codefuldebugonly
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      # `actions/cache@v5` is post-if: success(), so on a red run this job could
      # never persist the dependencies it downloaded. Save explicitly instead, but
      # only when the set is complete — a partial cache would restore as a HIT forever.
      - name: Verify hydrated runtime dependencies
        id: deps-check
        if: always()
        run: |
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          ok=true
          for d in FuncCoreTools DotNetSDK NodeJs; do
            if [ -d "$DEPS_DIR/$d" ]; then
              echo "present: $d"
            else
              echo "MISSING: $d"
              ok=false
            fi
          done
          FUNC_BIN="$(find "$DEPS_DIR/FuncCoreTools" -maxdepth 2 \( -name 'func' -o -name 'func.exe' \) -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$FUNC_BIN" ] && "$FUNC_BIN" --version; then
            echo "func is runnable: $FUNC_BIN"
          else
            echo "func did not run (existence is not enough)"
            ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Save Logic Apps runtime dependencies
        if: always() && steps.la-deps-cache.outputs.cache-hit != 'true' && steps.deps-check.outputs.ok == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-codeful-windows-latest
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Azurite readiness E2E on Windows.
  #
  # Why a separate job instead of an `os` matrix on vscode-e2e-azurite: `needs` is
  # declared per job, not per matrix leg, so a matrix would force the ubuntu leg to
  # wait on setup-runtime-deps-windows for no reason. The codeful legs are split the
  # same way for the same reason — this follows the established shape rather than
  # inventing a third pattern.
  #
  # Why Windows matters here specifically: the Azurite readiness race is a TIMING bug.
  # Windows is materially slower to start the extension host, hydrate runtime
  # dependencies and answer on the emulator ports, so it is the environment most
  # likely to surface a regression in the bounded-wait behaviour — and it is the
  # platform the reported codeful debug failure came from.
  # ---------------------------------------------------------------------------
  vscode-e2e-azurite-windows:
    name: vscode-e2e-azurite (windows-latest, ${{ matrix.kind }})
    # Depends on the Windows runtime-dependency bootstrap for the same reason as
    # vscode-e2e-codeful-windows: a cold la-runtime-deps-Windows cache means the
    # extension hydrates dependencies underneath the already-running test, which is
    # what used to make the Windows legs fail for reasons unrelated to the product.
    needs: [setup-extension-build, setup-runtime-deps-windows]
    # Observed: max 8.5 min, but from only ONE run — these legs are brand new.
    # Sized generously on purpose until more samples exist, and to still fit when
    # setup-runtime-deps-windows fails and this hydrates cold (~+10 min).
    # See the policy on setup-extension-build.
    timeout-minutes: 25
    runs-on: windows-latest
    # Sharded by app kind — see the ubuntu leg for the rationale. It matters more
    # here: Windows is the slower runner and the codeful kind additionally drives a
    # dotnet build, so looping both kinds in one job would have put this leg
    # uncomfortably close to the 45 min timeout.
    strategy:
      fail-fast: false
      matrix:
        kind: [codeless, codeful]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Verify node on PATH (for func host child processes)
        run: |
          echo "node: $(command -v node) $(node --version)"
          echo "npm:  $(command -v npm)  $(npm --version)"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      # The test binds 10000-10002 itself and fails loudly if it cannot. Assert the
      # ports are free up front so a pre-existing emulator on the image is reported
      # as an infrastructure problem rather than a product regression.
      - name: Verify Azurite ports are free
        shell: pwsh
        run: |
          foreach ($port in 10000, 10001, 10002) {
            $inUse = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            if ($inUse) {
              Write-Host "::error::Port $port is already in use; Phase 4.13 needs to bind it to simulate an unavailable Azurite."
              $inUse | Format-Table -AutoSize | Out-String | Write-Host
              exit 1
            }
            Write-Host "port ${port}: free"
          }

      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          if [ -d "$DEPS_DIR" ]; then
            echo "deps dir exists: $DEPS_DIR"
            du -sh "$DEPS_DIR" 2>/dev/null || true
            ls -la "$DEPS_DIR" || true
          else
            echo "deps dir MISSING (cold): $DEPS_DIR"
          fi

      - name: Run Azurite readiness E2E
        run: |
          echo "PATH=$PATH"
          node apps/vs-code-designer/out/test/run-e2e.js
        env:
          E2E_MODE: azuriteonly
          AZURITE_E2E_APP_KINDS: ${{ matrix.kind }}
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-azurite-windows-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Func Core Tools pre-debug self-heal (p414-funcrepair) on Windows.
  #
  # Why Windows specifically. The behaviour under test is the repair of an
  # extension-managed func that EXISTS but will not RUN, and every real-world cause
  # of that state skews Windows: AV quarantine, a partial extract, and an orphan
  # func.exe holding a file lock (binaries.ts:224-243 reasons explicitly about
  # EPERM/EBUSY from a locked func.exe). Critically, a running .exe is UNWRITABLE on
  # Windows — a failure mode Linux structurally cannot reproduce, because there an
  # executable can be overwritten while it runs. The ubuntu `func-selfheal` shard
  # therefore proves the repair logic but not the platform it matters on. Nothing
  # else covers this change on Windows either: test.yml, pr-coverage.yml and
  # private-vsix-build.yml are all `runs-on: ubuntu-latest`, so even the unit tests
  # never execute there.
  #
  # Why this job CREATES its own fixtures instead of consuming
  # `workspace-fixtures-<sha>` the way the ubuntu shard does: THAT ARTIFACT IS NOT
  # CROSS-PLATFORM. `created-workspaces.json` records ABSOLUTE paths (wsDir /
  # wsFilePath / appDir — see workspaceManifest.ts) produced under the ubuntu
  # runner's RUNNER_TEMP (/home/runner/work/_temp/...). Extracting that tarball on
  # windows-latest puts the tree under D:\a\_temp\la-e2e-test while every path inside
  # the manifest still points at a directory that does not exist there, so
  # selectWorkspaceForSpec() falls through to `resources: []` and funcRepair.test.ts
  # opens a nonexistent .code-workspace. Nothing rebases those paths, and no existing
  # Windows job consumes the artifact — it is ubuntu-bound by construction. So we run
  # p41a-fixtures HERE, which builds the workspaces through the real Create Workspace
  # wizard on this runner (SKILL.md rule 1) and, as a side effect, guarantees the
  # runtime dependencies are hydrated BEFORE the scenario that corrupts them runs.
  # The extension bundle is provisioned by that same run, so this job consumes only
  # the cross-platform JS extension-build artifact — the same shape as
  # vscode-e2e-codeful-windows.
  #
  # BLOCKING: listed in the vscode-e2e-summary gate below with NO continue-on-error
  # (continue-on-error would force `needs.<job>.result` to "success" and silently
  # green the gate).
  vscode-e2e-funcselfheal-windows:
    name: vscode-e2e-funcselfheal (windows-latest)
    # setup-runtime-deps-windows is REQUIRED here, not decorative. This is the most
    # cold-cache-sensitive job in the workflow: p414-funcrepair is the only scenario
    # that downloads the Func Core Tools package TWICE (the initial managed install,
    # then the repair after it has been corrupted). vscode-e2e-codeful-windows used to
    # fail 100% of the time purely because la-runtime-deps-Windows-v1 was cold and
    # hydrated underneath the already-running test. Here a cold cache is worse than
    # merely slow: an activation-time install ends in startAllDesignTimeApis()
    # (binaries.ts:213 — which does NOT honour autoStartDesignTime), and the resulting
    # live func.exe makes the in-place corruption fail with EPERM/EBUSY on Windows.
    # The p41a-fixtures step below is the second line of defence for that.
    #
    # setup-fixtures is deliberately ABSENT: its artifact is ubuntu-path-bound (see
    # above), so depending on it would only serialize this job behind an unrelated
    # ubuntu run for an artifact it must not use.
    needs: [setup-extension-build, setup-runtime-deps-windows]
    # Timeout reasoning (see the policy on setup-extension-build — a backstop against a
    # wedged runner, ~2x the worst HEALTHY run, not an SLA):
    #   ~4 min  fixed setup (checkout, node, dotnet, pnpm install, artifact, restore).
    #           Derived from setup-runtime-deps-windows, whose whole job — the same
    #           p41a-fixtures scenario plus this same preamble — maxed at 11.3 min over
    #           16 runs INCLUDING a cold dependency download.
    #   ~8 min  p41a-fixtures on Windows (the 11.3 min above minus that preamble).
    #  ~12 min  p414-funcrepair on Windows. Healthy on ubuntu is 5-8 min and Windows
    #           adds ExTester cold start plus a slower second Func Core Tools download.
    #           A single attempt is hard-bounded at 16 min by TEST_TIMEOUT inside
    #           funcRepair.test.ts, so a wedged attempt self-terminates with its own
    #           diagnostic rather than riding this timeout.
    # => ~24 min for a healthy pass; ~36-42 min when LA_E2E_SCENARIO_RETRIES burns one
    # retry, which is exactly the slow-but-green case a tight timeout would convert
    # into a red build. 45 leaves margin over that without letting a genuinely wedged
    # runner sit for an hour. This is a first-ever run on this platform, so it is sized
    # to survive the unknown and can be tightened once real observations exist.
    timeout-minutes: 45
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Verify node on PATH (for func host child processes)
        run: |
          echo "node: $(command -v node) $(node --version)"
          echo "npm:  $(command -v npm)  $(npm --version)"

      # p41a-fixtures creates the customCode / rulesEngine / codeful workspace shapes,
      # which run dotnet. setup-runtime-deps-windows installs the SDK for the same
      # reason before running the same scenario.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      # RESTORE-ONLY (no save) — deliberate, and for a stronger reason than the
      # vscode-e2e-windows shard's. This job DELIBERATELY CORRUPTS the managed func
      # binaries; funcRepair.test.ts restores the pristine bytes in afterEach, but a
      # crashed session can leave a corrupted or partially-restored tree behind.
      # Saving that onto la-runtime-deps-Windows-v1 would be unrecoverable: every
      # later run would restore it as an EXACT-key HIT, and the hydrating jobs'
      # `cache-hit != 'true'` save guard would suppress the repair. The existing
      # `deps-check` guard on the other Windows jobs is not sufficient protection
      # either — it probes only the FIRST func it finds via `find -maxdepth 2`, so a
      # still-corrupted in-proc6/func.exe would pass it. setup-runtime-deps-windows
      # already seeds and refreshes this key on every run, so there is nothing to gain
      # against a real risk of poisoning it.
      # NOTE: `path`/`key`/`restore-keys` must stay byte-identical to the other
      # la-runtime-deps steps — actions/cache derives the cache entry *version* from
      # the path set, so editing it silently invalidates the existing entries.
      - name: Restore Logic Apps runtime dependencies
        id: la-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.azurelogicapps/dependencies
          key: la-runtime-deps-${{ runner.os }}-v1
          restore-keys: |
            la-runtime-deps-${{ runner.os }}-

      - name: Report runtime dependency cache state
        run: |
          echo "cache-hit:         ${{ steps.la-deps-cache.outputs.cache-hit }}"
          echo "cache-matched-key: ${{ steps.la-deps-cache.outputs.cache-matched-key }}"
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          if [ -d "$DEPS_DIR" ]; then
            echo "deps dir exists: $DEPS_DIR"
            du -sh "$DEPS_DIR" 2>/dev/null || true
            ls -la "$DEPS_DIR" || true
          else
            echo "deps dir MISSING (cold): $DEPS_DIR"
          fi

      # Separate step from the scenario below on purpose: it makes a fixtures failure
      # unambiguously distinguishable from a repair failure in the CI log, and it keeps
      # LA_E2E_STRICT_DEPENDENCY_VALIDATION scoped to this step only. That env var is
      # read by the PRODUCT inside the VS Code process
      # (strictDependencyValidation.ts:6), and leaking it into the funcrepair step
      # could force a dependency reinstall during that session's activation — which
      # ends in startAllDesignTimeApis() and a live func.exe that cannot be
      # overwritten. The ubuntu func-selfheal shard does not set it either.
      - name: Create Windows workspace fixtures (p41a-fixtures)
        run: |
          echo "PATH=$PATH"
          node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: p41a-fixtures
          LA_E2E_STRICT_DEPENDENCY_VALIDATION: '1'
          LA_E2E_BUNDLE_PREFLIGHT: '0'
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      # Closes a silent-green hole: funcRepair.test.ts calls `this.skip()` when the
      # manifest has no Standard/Stateful entry, which would report a PASSING job with
      # zero coverage. Resolved through node + os.tmpdir() rather than $RUNNER_TEMP so
      # this checks the exact path the test itself will read (and so the Windows
      # backslashes in RUNNER_TEMP never reach a bash path test).
      - name: Verify the Windows fixtures manifest is usable
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          node -e '
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const manifestPath = path.join(os.tmpdir(), "la-e2e-test", "created-workspaces.json");
          if (!fs.existsSync(manifestPath)) {
            console.log("::error::Fixtures manifest missing at " + manifestPath + " - p414-funcrepair has nothing to press F5 on.");
            process.exit(1);
          }
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const entry = manifest.find((e) => e.appType === "standard" && e.wfType === "Stateful");
          if (!entry) {
            console.log("::error::No Standard/Stateful workspace in " + manifestPath + " - funcRepair.test.ts would call this.skip() and pass vacuously.");
            console.log(JSON.stringify(manifest, null, 2));
            process.exit(1);
          }
          if (!fs.existsSync(entry.wsFilePath)) {
            console.log("::error::Manifest entry points at a missing .code-workspace: " + entry.wsFilePath);
            process.exit(1);
          }
          console.log("Fixtures OK: " + entry.wsFilePath);
          '

      - name: Run func self-heal scenario (p414-funcrepair)
        run: |
          echo "PATH=$PATH"
          node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: p414-funcrepair
          # No bundle artifact is hydrated here; the p41a-fixtures step above already
          # downloaded and verified the extension bundle on this runner.
          LA_E2E_BUNDLE_PREFLIGHT: '0'
          # Retry a failing scenario once in a fresh VS Code session. Non-masking: a
          # scenario that fails both attempts still fails the job.
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      # First run of this scenario on Windows, so report the disk state either way — a
      # func that is still unrunnable after the test's afterEach restore is the signal
      # that the cleanup path itself needs work on this platform.
      - name: Report managed func state after the run
        if: always()
        run: |
          DEPS_DIR="${HOME}/.azurelogicapps/dependencies"
          if [ ! -d "$DEPS_DIR/FuncCoreTools" ]; then
            echo "FuncCoreTools MISSING under $DEPS_DIR"
            exit 0
          fi
          find "$DEPS_DIR/FuncCoreTools" -maxdepth 2 -name 'func.exe' -type f -print -exec ls -la {} \; 2>/dev/null || true
          FUNC_BIN="$(find "$DEPS_DIR/FuncCoreTools" -maxdepth 2 -name 'func.exe' -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$FUNC_BIN" ] && "$FUNC_BIN" --version; then
            echo "func is runnable after the run: $FUNC_BIN"
          else
            echo "::warning::Managed func is NOT runnable after the run - funcRepair.test.ts's afterEach restore may have failed on Windows"
          fi

      # On a platform this scenario has never run on, the screenshot artifact is the
      # difference between a diagnosable failure and a blind one — a screenshot
      # artifact is how the last ubuntu failure of this scenario got root-caused. The
      # test also writes explicit captures under
      # <TEMP>/test-resources/screenshots/funcRepair-explicit/, which is inside the
      # first path below because TEMP is pinned to runner.temp above.
      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-funcselfheal-windows
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  vscode-e2e-compat:
    name: vscode-e2e compatibility (${{ matrix.label }})
    needs: setup-extension-build
    # Headroom for one activation-smoke retry (LA_E2E_SCENARIO_RETRIES).
    # Observed: max 5.6 min over 25 runs. See the policy on setup-extension-build.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner Node version drives pnpm/tsup/run-e2e.js and any child
          # processes that resolve node from PATH. The extension-host Node
          # version is owned by the VS Code/Electron build below.
          #
          # Keep an explicit legacy smoke so the latest extension continues to
          # activate on the stable runner/runtime combination used by the full
          # VS Code E2E suite.
          - label: node20-vscode108
            node-version: 20.x
            vscode-version: 1.108.0
          - label: node22-vscode108
            node-version: 22.x
            vscode-version: 1.108.0
          # VS Code 1.123 carries the Electron/Node 24 runtime that exposed the
          # removed node:util helper regression fixed by this branch.
          - label: node24-vscode123
            node-version: 24.x
            vscode-version: 1.123.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Symlink node to system path
        run: |
          NODE_BIN="$(which node)"
          NPM_BIN="$(which npm)"
          NPX_BIN="$(which npx)"
          for dir in /usr/local/bin /usr/bin; do
            sudo ln -sf "$NODE_BIN" "$dir/node"
            sudo ln -sf "$NPM_BIN"  "$dir/npm"
            sudo ln -sf "$NPX_BIN"  "$dir/npx"
          done
          echo "Symlinked node $(node --version) into /usr/local/bin and /usr/bin"
          env -i /usr/bin/node --version

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Download extension build artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: .

      - name: Extract build artifacts
        run: tar -xzf extension-build.tar.gz

      - name: Install system dependencies for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libgtk-3-0 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0 libatk1.0-0

      - name: Run compatibility activation smoke
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/usr/bin:/bin:$PATH"
          echo "PATH=$PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node apps/vs-code-designer/out/test/run-e2e.js
        env:
          LA_E2E_SCENARIO: p40-nonlogicapp
          E2E_VSCODE_VERSION: ${{ matrix.vscode-version }}
          # Retry the activation smoke once in a fresh session to absorb
          # transient launch/activation races on the compat runtime matrix.
          LA_E2E_SCENARIO_RETRIES: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test screenshots (always)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vscode-e2e-screenshots-compat-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/test-resources/screenshots/
            test-resources/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # Rollup status check so branch protection can require a single check name
  # ("vscode-e2e-summary") regardless of how many scenarios we add later.
  vscode-e2e-summary:
    name: vscode-e2e-summary
    needs: [setup-extension-build, setup-fixtures, vscode-e2e, vscode-e2e-windows, vscode-e2e-cli-create-workspace, vscode-e2e-codeful-ubuntu, vscode-e2e-codeful-windows, vscode-e2e-azurite, vscode-e2e-azurite-windows, vscode-e2e-funcselfheal-windows, vscode-e2e-compat, setup-runtime-deps-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          # Fail-closed: `!= "success"` treats both `skipped` and `cancelled` as failure.
          # Every job named in this chain must NOT set `continue-on-error`, which would
          # force its `result` to "success" regardless of conclusion and silently green
          # the gate. setup-runtime-deps-windows is the only job using it, and it is
          # intentionally reported below but excluded from the chain.
          echo "setup-extension-build:      ${{ needs.setup-extension-build.result }}"
          echo "setup-fixtures:             ${{ needs.setup-fixtures.result }}"
          echo "vscode-e2e (matrix):        ${{ needs.vscode-e2e.result }}"
          echo "vscode-e2e-windows:         ${{ needs.vscode-e2e-windows.result }}"
          echo "vscode-e2e-cli-create-workspace: ${{ needs.vscode-e2e-cli-create-workspace.result }}"
          echo "vscode-e2e-codeful-ubuntu:  ${{ needs.vscode-e2e-codeful-ubuntu.result }}"
          echo "vscode-e2e-codeful-windows: ${{ needs.vscode-e2e-codeful-windows.result }}"
          echo "vscode-e2e-azurite:         ${{ needs.vscode-e2e-azurite.result }}"
          echo "vscode-e2e-azurite-windows: ${{ needs.vscode-e2e-azurite-windows.result }}"
          echo "vscode-e2e-funcselfheal-windows: ${{ needs.vscode-e2e-funcselfheal-windows.result }}"
          echo "setup-runtime-deps-windows: ${{ needs.setup-runtime-deps-windows.result }} (advisory, not gated: seeds la-runtime-deps-Windows-v1)"
          echo "compat matrix:              ${{ needs.vscode-e2e-compat.result }}"
          if [ "${{ needs.setup-extension-build.result }}" != "success" ] || \
             [ "${{ needs.setup-fixtures.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e-windows.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e-cli-create-workspace.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e-codeful-ubuntu.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e-codeful-windows.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e-azurite.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e-azurite-windows.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e-funcselfheal-windows.result }}" != "success" ] || \
             [ "${{ needs.vscode-e2e-compat.result }}" != "success" ]; then
            echo "::error::One or more required vscode-e2e jobs failed"
            exit 1
          fi
          # Both codeful legs are BLOCKING as of this PR. They were advisory in #9463
          # only because the F5 task-chain assertions rode an unfixed Azurite startup
          # race (preDebugValidate -> validateEmulatorIsRunning popped a
          # headless-unanswerable AzureWebJobsStorage modal, so startDebugging never
          # settled). This change set fixes that race at the source and adds
          # vscode-e2e-azurite, which reproduces the failure deliberately by binding
          # Azurite's ports and asserting the modal never appears. Promoting both legs
          # was the stated deliverable of this follow-up.
          #
          # vscode-e2e-azurite runs on BOTH ubuntu-latest and windows-latest, and each
          # leg exercises the scenario for BOTH app kinds (codeless and codeful).
          # activateAzurite is called unconditionally in pickFuncProcessInternal before
          # the isCodeless branch, so codeful F5 goes through the same readiness path;
          # covering only codeless would have left the reported platform untested.
          #
          # setup-runtime-deps-windows is deliberately NOT gated and stays
          # continue-on-error. It is a cache-seeding job: once
          # la-runtime-deps-Windows-v1 exists it is refreshed on access, so a
          # transient bootstrap failure still leaves the codeful leg with a warm
          # restore. Keeping it continue-on-error also guarantees the Windows jobs
          # that depend on it (vscode-e2e-codeful-windows, vscode-e2e-azurite-windows,
          # vscode-e2e-funcselfheal-windows) still RUN rather than being skipped — and
          # a skipped job would trip the `!= "success"` check above and fail the build
          # for the wrong reason.
          #
          # vscode-e2e-funcselfheal-windows is BLOCKING and has no continue-on-error.
          # Its `needs` are [setup-extension-build, setup-runtime-deps-windows]: the
          # second can never cause a skip (continue-on-error pins its result to
          # "success"), and the first is itself gated here, so the only way this job is
          # skipped is a build failure that already fails the gate on its own line. It
          # covers p414-funcrepair on Windows, which is the platform the repaired
          # failure mode actually comes from — AV quarantine, partial extraction, and
          # an orphan func.exe holding a lock, plus the fact that a running .exe is
          # unwritable there at all. It also creates its own workspace fixtures rather
          # than consuming workspace-fixtures-<sha>, whose manifest stores ubuntu
          # absolute paths; see the job for the full rationale.
          echo "All required vscode-e2e jobs passed."
