name: Deploy Documentation

on:
  workflow_dispatch:
  repository_dispatch:
    types: [release]
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled]
    branches:
      - main

permissions: {}

concurrency:
  group: deploy-docs-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: |
      github.actor != 'csigs'
      && github.actor != 'azure-logic-apps-automation'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        || github.event_name == 'repository_dispatch'
        || (
          github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && contains(github.event.pull_request.labels.*.name, 'Documentation')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-docs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-docs-

      - name: Set up Node.js version 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false

      - uses: pnpm/action-setup@v5
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]
              
      - run: pnpm turbo run build:docs

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          skip_app_build: true
          app_build_command: 'cd docs && npm run build'
          app_location: 'apps/docs/build'
          output_location: 'apps/docs/build'

  close_pull_request_job:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed') && github.actor != 'csigs' && github.actor != 'azure-logic-apps-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Close Pull Request Job
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          app_location: 'apps/docs/build'
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
