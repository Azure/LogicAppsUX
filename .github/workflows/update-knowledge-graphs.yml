name: Update Knowledge Graphs

# Manually rebuild Graphify knowledge graphs and upload a patch artifact for PR creation.
# Uses pure AST extraction (no LLM, no API keys, ~30s for all libs).
# Direct pushes to main are blocked by branch rulesets, so this workflow produces a downloadable patch.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-knowledge-graphs
  cancel-in-progress: false

jobs:
  rebuild-graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Graphify
        run: pip install graphifyy

      - name: Rebuild all knowledge graphs
        run: bash scripts/graphify-rebuild.sh

      - name: Check for changes and generate patch
        id: check
        shell: bash
        run: |
          # Mark newly generated untracked files under libs/*/src/graphify-out/ as intent-to-add
          # so both modified and newly added graph artifacts appear in git diff / knowledge-graphs.patch.
          git add -N -- libs/*/src/graphify-out/
          if git diff --quiet -- libs/*/src/graphify-out/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Knowledge Graphs Up to Date"
              echo ""
              echo "No changes were detected in \`libs/*/src/graphify-out/\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git diff -- libs/*/src/graphify-out/ > knowledge-graphs.patch
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Knowledge Graphs Patch Ready"
              echo ""
              echo "Changes were detected in \`libs/*/src/graphify-out/\` and uploaded as the \`knowledge-graphs-patch\` artifact."
              echo ""
              echo "### How to apply and open a PR"
              echo "\`\`\`bash"
              echo "git checkout -b chore/update-knowledge-graphs origin/main"
              echo "git apply knowledge-graphs.patch"
              echo "git add libs/*/src/graphify-out/"
              echo "git commit -m \"chore: update knowledge graphs\""
              echo "git push -u origin chore/update-knowledge-graphs"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload knowledge graphs patch artifact
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: knowledge-graphs-patch
          path: knowledge-graphs.patch
          retention-days: 14
