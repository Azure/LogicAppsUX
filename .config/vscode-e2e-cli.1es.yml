# 1ES/MicroBuild validation pipeline for branch-selected VS Code @vscode/test-cli E2E.
# Create/update the Azure DevOps definition to this file only after required
# protected-resource gates are owner-approved.
trigger: none
pr: none

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/heads/release
    - repository: azExtTemplates
      type: github
      name: microsoft/vscode-azuretools
      ref: azext-pt/v1
      endpoint: GitHub-AzureTools

parameters:
  - name: diagnosticOnly
    displayName: Diagnostic selected rerun; cannot satisfy full rollup
    type: boolean
    default: false

  - name: runLinux
    displayName: Run Linux suite jobs
    type: boolean
    default: true

  - name: runWindows
    displayName: Run Windows suite jobs
    type: boolean
    default: true

  - name: linuxSuites
    displayName: Linux suites or alias
    type: string
    default: linux

  - name: windowsSuites
    displayName: Windows suites or alias
    type: string
    default: windows

variables:
  - template: azdo-pipelines/azcode.variables.yml@azExtTemplates
  - name: TeamName
    value: Azure Logic Apps for VS Code
  - name: working_directory
    value: .

extends:
  template: azure-pipelines/MicroBuild.1ES.Unofficial.yml@1esPipelines
  parameters:
    sdl:
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)\.azure-pipelines\compliance\CredScanSuppressions.json
      codeql:
        language: javascript
    pool:
      name: VSEngSS-MicroBuild2022-1ES
      image: server2022-microbuildVS2022-1es
      os: windows
    stages:
      - stage: VSCodeE2EConsumer
        displayName: VS Code @vscode/test-cli E2E consumer
        jobs:
          - job: resolve_consumer_context
            displayName: Resolve shared VS Code E2E consumer context
            pool:
              name: VSEngSS-MicroBuild2022-1ES
              image: server2022-microbuildVS2022-1es
              os: windows
            templateContext:
              type: validationJob
            steps:
              - checkout: self
                fetchDepth: 0

              - task: UseNode@1
                displayName: Use trusted Node.js for selector validation
                inputs:
                  version: '22.x'

              - pwsh: node --version
                displayName: Print selector validation Node.js version

              - pwsh: |
                  $releases = Invoke-RestMethod -Method Get -Uri 'https://update.code.visualstudio.com/api/releases/stable'
                  if (-not $releases -or -not $releases[0]) {
                    throw 'Unable to resolve latest stable VS Code version.'
                  }
                  $sourceVersion = '$(Build.SourceVersion)'
                  if ($sourceVersion -notmatch '^[0-9a-fA-F]{40}$') {
                    throw "Build.SourceVersion must be a full git SHA for source-head E2E validation. actual='$sourceVersion'"
                  }
                  Write-Host "Resolved stable VS Code build: $($releases[0])"
                  Write-Host "##vso[task.setvariable variable=resolvedVSCodeBuild;isOutput=true]$($releases[0])"
                  Write-Host "Pinned source SHA: $sourceVersion"
                  Write-Host "##vso[task.setvariable variable=pinnedSourceSha;isOutput=true]$sourceVersion"
                name: resolveStableVSCode
                displayName: Resolve stable VS Code build and source SHA once

              - pwsh: node apps/vs-code-designer/scripts/resolve-e2e-cli-suite-selection.js
                name: validateSuiteSelection
                displayName: Validate requested suite selectors before build
                env:
                  LA_E2E_CLI_DIAGNOSTIC_ONLY: ${{ parameters.diagnosticOnly }}
                  LA_E2E_CLI_RUN_LINUX: ${{ parameters.runLinux }}
                  LA_E2E_CLI_RUN_WINDOWS: ${{ parameters.runWindows }}
                  LA_E2E_CLI_LINUX_SUITES: ${{ parameters.linuxSuites }}
                  LA_E2E_CLI_WINDOWS_SUITES: ${{ parameters.windowsSuites }}

          - job: build_current_run_e2e_artifact
            displayName: Build current-run VS Code E2E artifact
            dependsOn:
              - resolve_consumer_context
            pool:
              name: AzurePipelines-EO
              image: 1ESPT-Ubuntu22.04
              os: linux
            variables:
              - name: pinnedSourceSha
                value: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/vscode-e2e
                  artifactName: vscode-e2e-build
            steps:
              - checkout: self
                fetchDepth: 0

              - pwsh: |
                  git checkout "$(pinnedSourceSha)"
                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }
                  $rawHead = git rev-parse HEAD
                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }
                  $head = ([string]$rawHead).Trim()
                  if ($head -ne '$(pinnedSourceSha)') {
                    throw "E2E artifact build checkout HEAD '$head' does not match pinned source SHA '$(pinnedSourceSha)'."
                  }
                displayName: Checkout pinned source SHA for E2E artifact

              - template: /.azure-pipelines/templates/vscode-e2e-cli-setup.yml@self
                parameters:
                  feedBaseUrl: ${{ variables.feedBaseUrl }}
                  nodeVersion: '22.x'
                  dotnetVersion: '8.0.x'
                  includeDotNet: true
                  includeLinuxDisplayDependencies: false

              - template: /.azure-pipelines/templates/vscode-e2e-cli-build-artifacts.yml@self
                parameters:
                  artifactStagingPath: $(Build.ArtifactStagingDirectory)/vscode-e2e

          - template: /.config/templates/vscode-e2e-cli-run-suite.yml@self
            parameters:
              jobName: linux_unit_tests
              displayName: Linux unit tests
              suiteId: unitTests
              shortName: lu
              cliArguments: --label unitTests
              artifactName: linux-unit-tests
              selected: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.linux_unitTests'] ]
              dependsOn: [resolve_consumer_context, build_current_run_e2e_artifact]
              resolvedVSCodeVersion: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.resolvedVSCodeBuild'] ]
              expectedSourceSha: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]
              feedBaseUrl: ${{ variables.feedBaseUrl }}
              pool:
                name: AzurePipelines-EO
                image: 1ESPT-Ubuntu22.04
                os: linux
              platform: linux
              expectedProducerDefinitionId: $(System.DefinitionId)
              expectedProducerRunId: $(Build.BuildId)
              checkoutRef: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]

          - template: /.config/templates/vscode-e2e-cli-run-suite.yml@self
            parameters:
              jobName: linux_create_workspace_behavior
              displayName: Linux create workspace behavior
              suiteId: createWorkspaceBehavior
              shortName: lb
              cliArguments: --label createWorkspaceBehavior
              artifactName: linux-create-workspace-behavior
              selected: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.linux_createWorkspaceBehavior'] ]
              dependsOn: [resolve_consumer_context, build_current_run_e2e_artifact]
              resolvedVSCodeVersion: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.resolvedVSCodeBuild'] ]
              expectedSourceSha: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]
              feedBaseUrl: ${{ variables.feedBaseUrl }}
              pool:
                name: AzurePipelines-EO
                image: 1ESPT-Ubuntu22.04
                os: linux
              platform: linux
              expectedProducerDefinitionId: $(System.DefinitionId)
              expectedProducerRunId: $(Build.BuildId)
              checkoutRef: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]

