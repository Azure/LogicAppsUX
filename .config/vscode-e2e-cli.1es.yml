              checkoutRef: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]

          - template: /.config/templates/vscode-e2e-cli-run-suite.yml@self
            parameters:
              jobName: windows_create_workspace_preview_matrix
              displayName: Windows create workspace preview matrix
              suiteId: createWorkspacePreviewMatrix
              shortName: wp
              cliArguments: --label createWorkspacePreviewMatrix
              artifactName: windows-create-workspace-preview-matrix
              selected: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.windows_createWorkspacePreviewMatrix'] ]
              dependsOn: [resolve_consumer_context, build_current_run_e2e_artifact]
              resolvedVSCodeVersion: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.resolvedVSCodeBuild'] ]
              expectedSourceSha: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]
              feedBaseUrl: ${{ variables.feedBaseUrl }}
              pool:
                name: VSEngSS-MicroBuild2022-1ES
                image: server2022-microbuildVS2022-1es
                os: windows
              platform: windows
              expectedProducerDefinitionId: $(System.DefinitionId)
              expectedProducerRunId: $(Build.BuildId)
              checkoutRef: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]

          - template: /.config/templates/vscode-e2e-cli-run-suite.yml@self
            parameters:
              jobName: windows_create_workspace_codeful
              displayName: Windows create workspace codeful
              suiteId: createWorkspaceCodeful
              shortName: wf
              cliArguments: --label createWorkspaceCodeful
              artifactName: windows-create-workspace-codeful
              selected: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.windows_createWorkspaceCodeful'] ]
              dependsOn: [resolve_consumer_context, build_current_run_e2e_artifact]
