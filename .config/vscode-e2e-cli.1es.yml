              suites: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.linux_nonAzureSuites'] ]
              runRegisteredContracts: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.linux_nonAzureRunsContracts'] ]
              trustedFullExecution: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.trustedFullExecution'] ]
              diagnosticOnly: ${{ parameters.diagnosticOnly }}
              dependsOn: [resolve_consumer_context, build_current_run_e2e_artifact]
              resolvedVSCodeVersion: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.resolvedVSCodeBuild'] ]
              expectedSourceSha: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]
              checkoutRef: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]
              feedBaseUrl: ${{ variables.feedBaseUrl }}
