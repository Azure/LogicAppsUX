              testARMServiceConnection: LogicAppsVSCode-E2E-SignIn
              azureResourceGroupName: LogicAppsVSCode-E2E-Fixtures
              azureLocationName: westus

          - template: /.config/templates/vscode-e2e-cli-run-suite.yml@self
