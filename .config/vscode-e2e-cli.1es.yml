              selected: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.windows_nonAzureSelected'] ]
              suites: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.windows_nonAzureSuites'] ]
              runRegisteredContracts: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.windows_nonAzureRunsContracts'] ]
              trustedFullExecution: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.trustedFullExecution'] ]
              diagnosticOnly: ${{ parameters.diagnosticOnly }}
              dependsOn: [resolve_consumer_context, build_current_run_e2e_artifact, seed_windows_pnpm_store]
              resolvedVSCodeVersion: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.resolvedVSCodeBuild'] ]
