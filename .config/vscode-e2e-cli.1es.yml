              testARMServiceConnection: LogicAppsVSCode-E2E-SignIn
              azureResourceGroupName: LogicAppsVSCode-E2E-Fixtures
              azureLocationName: westus

          - job: seed_windows_pnpm_store
            displayName: Seed shared Windows pnpm store for cohorts
            dependsOn:
              - resolve_consumer_context
              - build_current_run_e2e_artifact
            condition: and(not(failed()), not(canceled()), eq(variables['SeedRequired'], 'true'))
            timeoutInMinutes: 45
            pool:
              name: VSEngSS-MicroBuild2022-1ES
              image: server2022-microbuildVS2022-1es
              os: windows
            variables:
              - name: SeedRequired
                value: $[ dependencies.resolve_consumer_context.outputs['validateSuiteSelection.windowsPnpmSeedRequired'] ]
              - name: pinnedSourceSha
                value: $[ dependencies.resolve_consumer_context.outputs['resolveStableVSCode.pinnedSourceSha'] ]
            templateContext:
              type: validationJob
            steps:
              - checkout: self
                fetchDepth: 0
              - task: UseNode@1
                displayName: Use trusted Node.js for Windows cache seed
                inputs:
                  version: '22.x'
              - pwsh: |
                  git checkout "$(pinnedSourceSha)"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                displayName: Checkout pinned source SHA for Windows cache seed
              - template: /.azure-pipelines/templates/vscode-e2e-cli-setup.yml@self
                parameters:
                  feedBaseUrl: ${{ variables.feedBaseUrl }}
                  nodeVersion: '22.x'
                  includeDotNet: false
                  includeLinuxDisplayDependencies: false
                  provisionNode: false

