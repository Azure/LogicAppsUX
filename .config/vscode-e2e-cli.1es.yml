          - ${{ if eq(parameters.diagnosticOnly, false) }}:
              - job: verify_both_os_full_rollup
                displayName: Verify both-OS full rollup eligibility
                dependsOn:
                  - linux_unit_tests
                  - linux_create_workspace_behavior
                  - linux_create_workspace_core_matrix
                  - linux_create_workspace_preview_matrix
                  - linux_create_workspace_codeful
                  - linux_msn_weather_lifecycle
                  - windows_unit_tests
                  - windows_create_workspace_behavior
                  - windows_create_workspace_core_matrix
                  - windows_create_workspace_preview_matrix
                  - windows_create_workspace_codeful
                  - windows_msn_weather_lifecycle
                  - linux_non_azure_cohort
                  - linux_azure_cohort
                  - windows_non_azure_cohort
                  - windows_azure_cohort
                condition: always()
                pool:
                  name: VSEngSS-MicroBuild2022-1ES
                  image: server2022-microbuildVS2022-1es
                  os: windows
                variables:
                  - name: linuxUnitTestsResult
                    value: $[ dependencies.linux_unit_tests.result ]
                  - name: linuxCreateWorkspaceBehaviorResult
                    value: $[ dependencies.linux_create_workspace_behavior.result ]
                  - name: linuxCreateWorkspaceCoreMatrixResult
                    value: $[ dependencies.linux_create_workspace_core_matrix.result ]
                  - name: linuxCreateWorkspacePreviewMatrixResult
                    value: $[ dependencies.linux_create_workspace_preview_matrix.result ]
                  - name: linuxCreateWorkspaceCodefulResult
                    value: $[ dependencies.linux_create_workspace_codeful.result ]
                  - name: linuxMsnWeatherLifecycleResult
                    value: $[ dependencies.linux_msn_weather_lifecycle.result ]
                  - name: windowsUnitTestsResult
                    value: $[ dependencies.windows_unit_tests.result ]
                  - name: windowsCreateWorkspaceBehaviorResult
                    value: $[ dependencies.windows_create_workspace_behavior.result ]
                  - name: windowsCreateWorkspaceCoreMatrixResult
                    value: $[ dependencies.windows_create_workspace_core_matrix.result ]
                  - name: windowsCreateWorkspacePreviewMatrixResult
                    value: $[ dependencies.windows_create_workspace_preview_matrix.result ]
                  - name: windowsCreateWorkspaceCodefulResult
                    value: $[ dependencies.windows_create_workspace_codeful.result ]
                  - name: windowsMsnWeatherLifecycleResult
                    value: $[ dependencies.windows_msn_weather_lifecycle.result ]
                  - name: linuxNonAzureCohortResult
                    value: $[ dependencies.linux_non_azure_cohort.result ]
                  - name: linuxAzureCohortResult
                    value: $[ dependencies.linux_azure_cohort.result ]
                  - name: windowsNonAzureCohortResult
                    value: $[ dependencies.windows_non_azure_cohort.result ]
                  - name: windowsAzureCohortResult
                    value: $[ dependencies.windows_azure_cohort.result ]
                templateContext:
                  type: validationJob
                steps:
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-linux-unit-tests
                    displayName: Download Linux unit tests diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-linux-create-workspace-behavior
                    displayName: Download Linux create workspace behavior diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-linux-create-workspace-core-matrix
                    displayName: Download Linux create workspace core matrix diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-linux-create-workspace-preview-matrix
                    displayName: Download Linux create workspace preview matrix diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-linux-create-workspace-codeful
                    displayName: Download Linux create workspace codeful diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-linux-msn-weather-lifecycle
                    displayName: Download Linux MSN Weather lifecycle diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-windows-unit-tests
                    displayName: Download Windows unit tests diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-windows-create-workspace-behavior
                    displayName: Download Windows create workspace behavior diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-windows-create-workspace-core-matrix
                    displayName: Download Windows create workspace core matrix diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-windows-create-workspace-preview-matrix
                    displayName: Download Windows create workspace preview matrix diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-windows-create-workspace-codeful
                    displayName: Download Windows create workspace codeful diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-windows-msn-weather-lifecycle
                    displayName: Download Windows MSN Weather lifecycle diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))

                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-cohort-linux-nonAzure
                    displayName: Download Linux non-Azure cohort diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'cohort'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-cohort-linux-azure
                    displayName: Download Linux Azure cohort diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'cohort'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-cohort-windows-nonAzure
                    displayName: Download Windows non-Azure cohort diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'cohort'))
                  - download: current
                    artifact: vscode-e2e-cli-diagnostics-cohort-windows-azure
                    displayName: Download Windows Azure cohort diagnostics
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'cohort'))

                  - pwsh: |
                      $suites = @(
                        @{ job = 'linux_unit_tests'; result = '$(linuxUnitTestsResult)'; artifact = 'vscode-e2e-cli-diagnostics-linux-unit-tests'; suite = 'unitTests'; expectedMochaCompletions = 1; subtractMatrixFooter = $false },
                        @{ job = 'linux_create_workspace_behavior'; result = '$(linuxCreateWorkspaceBehaviorResult)'; artifact = 'vscode-e2e-cli-diagnostics-linux-create-workspace-behavior'; suite = 'createWorkspaceBehavior'; expectedMochaCompletions = 1; subtractMatrixFooter = $false },
                        @{ job = 'linux_create_workspace_core_matrix'; result = '$(linuxCreateWorkspaceCoreMatrixResult)'; artifact = 'vscode-e2e-cli-diagnostics-linux-create-workspace-core-matrix'; suite = 'createWorkspaceCoreMatrix'; expectedMochaCompletions = 6; subtractMatrixFooter = $true },
                        @{ job = 'linux_create_workspace_preview_matrix'; result = '$(linuxCreateWorkspacePreviewMatrixResult)'; artifact = 'vscode-e2e-cli-diagnostics-linux-create-workspace-preview-matrix'; suite = 'createWorkspacePreviewMatrix'; expectedMochaCompletions = 6; subtractMatrixFooter = $true },
                        @{ job = 'linux_create_workspace_codeful'; result = '$(linuxCreateWorkspaceCodefulResult)'; artifact = 'vscode-e2e-cli-diagnostics-linux-create-workspace-codeful'; suite = 'createWorkspaceCodeful'; expectedMochaCompletions = 2; subtractMatrixFooter = $true },
                        @{ job = 'linux_msn_weather_lifecycle'; result = '$(linuxMsnWeatherLifecycleResult)'; artifact = 'vscode-e2e-cli-diagnostics-linux-msn-weather-lifecycle'; suite = 'msnWeatherLifecycle'; expectedMochaCompletions = 3; subtractMatrixFooter = $false },
                        @{ job = 'windows_unit_tests'; result = '$(windowsUnitTestsResult)'; artifact = 'vscode-e2e-cli-diagnostics-windows-unit-tests'; suite = 'unitTests'; expectedMochaCompletions = 1; subtractMatrixFooter = $false },
                        @{ job = 'windows_create_workspace_behavior'; result = '$(windowsCreateWorkspaceBehaviorResult)'; artifact = 'vscode-e2e-cli-diagnostics-windows-create-workspace-behavior'; suite = 'createWorkspaceBehavior'; expectedMochaCompletions = 1; subtractMatrixFooter = $false },
                        @{ job = 'windows_create_workspace_core_matrix'; result = '$(windowsCreateWorkspaceCoreMatrixResult)'; artifact = 'vscode-e2e-cli-diagnostics-windows-create-workspace-core-matrix'; suite = 'createWorkspaceCoreMatrix'; expectedMochaCompletions = 6; subtractMatrixFooter = $true },
                        @{ job = 'windows_create_workspace_preview_matrix'; result = '$(windowsCreateWorkspacePreviewMatrixResult)'; artifact = 'vscode-e2e-cli-diagnostics-windows-create-workspace-preview-matrix'; suite = 'createWorkspacePreviewMatrix'; expectedMochaCompletions = 6; subtractMatrixFooter = $true },
                        @{ job = 'windows_create_workspace_codeful'; result = '$(windowsCreateWorkspaceCodefulResult)'; artifact = 'vscode-e2e-cli-diagnostics-windows-create-workspace-codeful'; suite = 'createWorkspaceCodeful'; expectedMochaCompletions = 2; subtractMatrixFooter = $true },
                        @{ job = 'windows_msn_weather_lifecycle'; result = '$(windowsMsnWeatherLifecycleResult)'; artifact = 'vscode-e2e-cli-diagnostics-windows-msn-weather-lifecycle'; suite = 'msnWeatherLifecycle'; expectedMochaCompletions = 3; subtractMatrixFooter = $false }
                      )
                      $identityFields = @(
                        'producerDefinitionId',
                        'producerRunId',
                        'producerBuildNumber',
                        'sourceSHA',
                        'checkoutRef',
                        'repositoryName',
                        'repositoryUri',
                        'artifactName',
                        'artifactSHA256',
                        'resolvedVSCodeBuild'
                      )
                      $baseline = $null
                      foreach ($suite in $suites) {
                        if ($suite.result -ne 'Succeeded') {
                          throw "Canonical suite job did not succeed: $($suite.job) result=$($suite.result)"
                        }
                        $root = Join-Path '$(Pipeline.Workspace)' $suite.artifact
                        $resultRoot = Join-Path $root 'results'
                        $logRoot = Join-Path $root 'log'
                        $resultPath = Join-Path $resultRoot "$($suite.suite).json"
                        $junitPath = Join-Path $resultRoot "$($suite.suite).junit.xml"
                        $summaryPath = Join-Path $resultRoot "$($suite.suite).summary.md"
                        $contextPath = Join-Path $resultRoot "admission-context-$($suite.suite).json"
                        $logPath = Join-Path $logRoot "$($suite.suite).log"
                        foreach ($required in @($resultPath, $junitPath, $summaryPath, $contextPath, $logPath)) {
                          if (-not (Test-Path $required)) {
                            throw "Missing required full-rollup artifact for $($suite.job): $required"
                          }
                        }
                        $result = Get-Content $resultPath -Raw | ConvertFrom-Json
                        $passing = [int]$result.passing
                        $failing = [int]$result.failing
                        $pending = [int]$result.pending
                        $total = [int]$result.total
                        if ($result.outcome -ne 'success' -or $passing -le 0 -or $failing -ne 0 -or $pending -ne 0 -or $total -ne $passing) {
                          throw "Suite result is not a successful executed test run: $($suite.job) outcome=$($result.outcome) total=$total passing=$passing failing=$failing pending=$pending"
                        }
                        $logText = Get-Content $logPath -Raw
                        $ansiEscape = "$([char]27)\[[0-?]*[ -/]*[@-~]"
                        $normalizedLogText = ($logText -replace "`r`n?", "`n") -replace $ansiEscape, ''
                        $mochaCompletions = [regex]::Matches($normalizedLogText, '(?m)^[ \t]*(\d+) passing(?: \([^)]+\))?[ \t]*$')
                        $realMochaCompletionCounts = @($mochaCompletions | ForEach-Object { [int]$_.Groups[1].Value })
                        if ($suite.subtractMatrixFooter -and $realMochaCompletionCounts.Count -gt 0) {
                          $lastCompletion = $mochaCompletions[$mochaCompletions.Count - 1].Value.Trim()
                          if ($normalizedLogText.TrimEnd().EndsWith($lastCompletion)) {
                            $realMochaCompletionCounts = @($realMochaCompletionCounts | Select-Object -First ($realMochaCompletionCounts.Count - 1))
                          }
                        }
                        if ($realMochaCompletionCounts.Count -lt [int]$suite.expectedMochaCompletions -or @($realMochaCompletionCounts | Where-Object { $_ -le 0 }).Count -gt 0) {
                          throw "Suite log does not contain enough positive real Mocha execution evidence: $($suite.job) expected=$($suite.expectedMochaCompletions) actual=$($realMochaCompletionCounts.Count) counts=$($realMochaCompletionCounts -join ',')"
                        }
                        $context = Get-Content $contextPath -Raw | ConvertFrom-Json
                        foreach ($field in $identityFields) {
                          if (-not [string]$context.$field) {
                            throw "Suite admitted identity is missing '$field': $($suite.job)"
                          }
                        }
                        if ($null -eq $baseline) {
                          $baseline = $context
                        } else {
                          foreach ($field in $identityFields) {
                            if ([string]$baseline.$field -ne [string]$context.$field) {
                              throw "Suite admitted identity mismatch for '$field': baseline=$($baseline.$field) $($suite.job)=$($context.$field)"
                            }
                          }
                        }
                      }
                    displayName: Enforce twelve-suite both-OS full rollup gate
                    condition: and(always(), eq('${{ parameters.executionTopology }}', 'perSuite'))

                  - pwsh: |
                      $cohorts = @(
                        @{ job = 'linux_non_azure_cohort'; result = '$(linuxNonAzureCohortResult)'; artifact = 'vscode-e2e-cli-diagnostics-cohort-linux-nonAzure' },
                        @{ job = 'linux_azure_cohort'; result = '$(linuxAzureCohortResult)'; artifact = 'vscode-e2e-cli-diagnostics-cohort-linux-azure' },
                        @{ job = 'windows_non_azure_cohort'; result = '$(windowsNonAzureCohortResult)'; artifact = 'vscode-e2e-cli-diagnostics-cohort-windows-nonAzure' },
                        @{ job = 'windows_azure_cohort'; result = '$(windowsAzureCohortResult)'; artifact = 'vscode-e2e-cli-diagnostics-cohort-windows-azure' }
                      )
                      $failed = @($cohorts | Where-Object { $_.result -ne 'Succeeded' })
                      if ($failed.Count -gt 0) {
                        throw "Canonical cohort job failure(s): $(($failed | ForEach-Object { "$($_.job)=$($_.result)" }) -join ', ')"
                      }
                      $arguments = @()
                      foreach ($cohort in $cohorts) {
                        $arguments += @('--artifact', (Join-Path '$(Pipeline.Workspace)' $cohort.artifact))
                      }
                      node apps/vs-code-designer/scripts/verify-e2e-cli-cohort-rollup.js @arguments
