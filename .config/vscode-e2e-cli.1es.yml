                    value: $[ dependencies.windows_msn_weather_lifecycle.result ]
                templateContext:
                  type: validationJob
                steps:
                  - pwsh: |
                      $selected = @(
                        @{ name = 'linux_workspace_regeneration'; selected = '$(linuxWorkspaceRegenerationSelected)'; result = '$(linuxWorkspaceRegenerationResult)' },
                        @{ name = 'windows_workspace_regeneration'; selected = '$(windowsWorkspaceRegenerationSelected)'; result = '$(windowsWorkspaceRegenerationResult)' },
                        @{ name = 'linux_http_timeout_compose'; selected = '$(linuxHttpTimeoutComposeSelected)'; result = '$(linuxHttpTimeoutComposeResult)' },
