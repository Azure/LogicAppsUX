  <circle cx="6" cy="16.5" r="1.2" fill="currentColor"/>
  <circle cx="3.5" cy="20.5" r="1" fill="currentColor"/>
  <circle cx="8.5" cy="20.5" r="1" fill="currentColor"/>
  <line x1="6" y1="17.7" x2="6" y2="19.3"/>
  <line x1="3.5" y1="19.3" x2="8.5" y2="19.3"/>
  <line x1="3.5" y1="19.3" x2="3.5" y2="20"/>
  <line x1="8.5" y1="19.3" x2="8.5" y2="20"/>
</svg>
