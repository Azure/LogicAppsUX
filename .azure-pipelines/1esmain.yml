# Trigger the build whenever `main` or `rel/*` is updated
trigger: none
  # - main
  # - rel/*

# Disable PR trigger
pr: none

# `resources` specifies the location of templates to pick up, use it to get 1ES templates
resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release
    - repository: azExtTemplates
      type: github
      name: microsoft/vscode-azuretools
      ref: main
      endpoint: GitHub-AzureTools # The service connection to use when accessing this repository
    - repository: LogicAppsUX
      type: github
      name: Azure/LogicAppsUX
      endpoint: LogicApps-VSCode-connection  # The service connection to use when accessing this repository

parameters:
  # When true, skips the deployment job which actually publishes the extension
  - name: dryRun
    displayName: Dry run
    type: boolean
    default: true

  - name: enableSigning
    displayName: Enable signing
    type: boolean
    default: True

  # The intended extension version to publish. 
  # This is used to verify the version in package.json matches the version to publish to avoid accidental publishing.
  - name: publishVersion
    displayName: Version to publish
    type: string

  # Customize the environment to associate the deployment with. 
  # Useful to control which group of people should be required to approve the deployment.
  - name: environmentName
    type: string
    default: VSCodeDeployLAUX

  - name: enableVscodeE2E
    displayName: Run VS Code E2E validation
    type: boolean
    default: false

  - name: testARMServiceConnection
    displayName: ARM WIF service connection for authenticated VS Code E2E shards
    type: string
    default: ''

  - name: vscodeE2ELinuxPool
    displayName: Approved 1ES Linux pool for VS Code E2E
    type: object
    default:
      name: '<OWNER_APPROVED_1ES_LINUX_POOL>'
      image: '<OWNER_APPROVED_1ES_LINUX_IMAGE>'
      os: linux

  - name: runVscodeTestCliSmoke
    displayName: Run Container Apps-style vscode-test smoke
    type: boolean
    default: true

  - name: vscodeE2EScenarioShards
    displayName: VS Code E2E scenario shards
    type: object
    default:
      - jobName: VscodeE2EActivationCreate
        displayName: vscode-e2e activation/create smoke
        scenario: p40-nonlogicapp,p48b-conversioncreate
        useWorkspaceFixtures: false
        useBundleArtifact: false
      - jobName: VscodeE2EDesignerLifecycle
        displayName: vscode-e2e designer lifecycle
        scenario: p42-standard,p42-customcode,p42-rulesengine
        useWorkspaceFixtures: true
        useBundleArtifact: true

variables:
  - template: azdo-pipelines/azcode.variables.yml@azExtTemplates
  # Required by MicroBuild template
  - name: TeamName
    value: "Azure Logic Apps for VS Code"
  - name: working_directory
    value: '.'

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@1esPipelines
  parameters:
    sdl:
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)\.azure-pipelines\compliance\CredScanSuppressions.json
      codeql:
        language: javascript # only build a codeql database for javascript, since the jsoncli pipeline handles csharp
      #   enabled: true # TODO: would like to enable only on scheduled builds but CodeQL cannot currently be disabled per https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-docs/codeql/1es-codeql
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    pool:
      name: VSEngSS-MicroBuild2022-1ES # Name of your hosted pool
      image: server2022-microbuildVS2022-1es # Name of the image in your pool. If not specified, first image of the pool is used
      os: windows # OS of the image. Allowed values: windows, linux, macOS
    stages:
      - stage: Build
        displayName: Build extension
        jobs:
          - job: Build
            templateContext:
              mb: # Enable the MicroBuild Signing toolset
                signing:
                  enabled: ${{ parameters.enableSigning }}
                  signType: real # options are 'real' & 'test'
                  signWithProd: true
                  zipSources: false
                  azureSubscription: "MicroBuild Signing Task (DevDiv)"
              outputs:
                - output: pipelineArtifact
                  targetPath: $(build.artifactstagingdirectory)/build/Root
                  artifactName: Build Root
            steps:
              - script: git checkout v${{ parameters.publishVersion }} # Replace with your desired version to release
                displayName: 'Checkout to specific branch'
              - template: .azure-pipelines/templates/setup.yml@LogicAppsUX
                parameters:
                  feedBaseUrl: ${{ variables.feedBaseUrl }}
              - template: .azure-pipelines/templates/build.yml@LogicAppsUX
              - template: .azure-pipelines/templates/package.yml@LogicAppsUX
                parameters:
                  publishVersion: ${{ parameters.publishVersion }}
              - template: .azure-pipelines/templates/sign.yml@LogicAppsUX
              - template: .azure-pipelines/templates/stage-artifacts.yml@LogicAppsUX
                parameters:
                  publishVersion: ${{ parameters.publishVersion }}

      - ${{ if eq(parameters.enableVscodeE2E, true) }}:
          - stage: VscodeE2E
            displayName: VS Code E2E validation
            dependsOn: Build
            jobs:
              - job: BuildVscodeE2EArtifacts
                displayName: Build VS Code E2E artifacts
                timeoutInMinutes: 30
                pool: ${{ parameters.vscodeE2ELinuxPool }}
                templateContext:
                  outputs:
                    - output: pipelineArtifact
                      targetPath: $(Build.ArtifactStagingDirectory)/vscode-e2e
                      artifactName: vscode-e2e-build
                steps:
                  - template: .azure-pipelines/templates/vscode-e2e-build-artifacts.yml@LogicAppsUX
                    parameters:
                      feedBaseUrl: ${{ variables.feedBaseUrl }}
                      checkoutRef: v${{ parameters.publishVersion }}

              - ${{ if eq(parameters.runVscodeTestCliSmoke, true) }}:
                  - template: .azure-pipelines/templates/vscode-e2e-run-cli.yml@LogicAppsUX
                    parameters:
                      jobName: VscodeE2ECliSmoke
                      displayName: vscode-test CLI smoke
                      label: unitTests
                      feedBaseUrl: ${{ variables.feedBaseUrl }}
                      pool: ${{ parameters.vscodeE2ELinuxPool }}
                      dependsOn:
                        - BuildVscodeE2EArtifacts
                      checkoutRef: v${{ parameters.publishVersion }}
                      testARMServiceConnection: ${{ parameters.testARMServiceConnection }}

              - template: .azure-pipelines/templates/vscode-e2e-setup-fixtures.yml@LogicAppsUX
                parameters:
                  jobName: SetupVscodeE2EFixtures
                  displayName: setup-fixtures (p41a)
                  feedBaseUrl: ${{ variables.feedBaseUrl }}
                  pool: ${{ parameters.vscodeE2ELinuxPool }}
                  dependsOn:
                    - BuildVscodeE2EArtifacts
                  checkoutRef: v${{ parameters.publishVersion }}

              - ${{ each shard in parameters.vscodeE2EScenarioShards }}:
                  - template: .azure-pipelines/templates/vscode-e2e-run-scenario.yml@LogicAppsUX
                    parameters:
                      jobName: ${{ shard.jobName }}
                      displayName: ${{ shard.displayName }}
                      scenario: ${{ shard.scenario }}
                      useWorkspaceFixtures: ${{ shard.useWorkspaceFixtures }}
                      useBundleArtifact: ${{ shard.useBundleArtifact }}
                      feedBaseUrl: ${{ variables.feedBaseUrl }}
                      pool: ${{ parameters.vscodeE2ELinuxPool }}
                      dependsOn:
                        - SetupVscodeE2EFixtures
                      checkoutRef: v${{ parameters.publishVersion }}
                      testARMServiceConnection: ''

              - template: .azure-pipelines/templates/vscode-e2e-summary.yml@LogicAppsUX
                parameters:
                  jobName: VscodeE2ESummary
                  displayName: vscode-e2e-summary
                  dependsOn:
                    - ${{ if eq(parameters.runVscodeTestCliSmoke, true) }}:
                        - VscodeE2ECliSmoke
                    - SetupVscodeE2EFixtures
                    - ${{ each shard in parameters.vscodeE2EScenarioShards }}:
                        - ${{ shard.jobName }}
