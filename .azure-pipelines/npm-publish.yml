# Manual npm release build for LogicAppsUX, driven by one GitHub Release page URL.
#
# Versioning and the GitHub Release stay in GitHub (version-release.yml). This pipeline takes the
# canonical Release page URL, resolves it to a published, non-draft, non-prerelease stable tag and
# its exact peeled commit, and builds that commit with the recipe (scripts/ado-npm-publisher*.cjs
# and this YAML) from the reviewed pipeline ref. Released tags never need to carry this pipeline.
# The product build scripts (pnpm build:lib, scripts/update-versions.js) come from the released tree.
# Release assets (VSIX, iframe ZIP) are never read or treated as npm packages.
#
# Released source is built exactly as tagged. A release whose package manifests fail the strict
# archive contract (for example the stylesheet exports removed by 05f0408d7, not yet on main) resolves
# successfully but fails packing/validation; cut a new release after the fix lands instead of patching.
#
# Production publishing is not activated: no feed credential, service connection or writer runs here.
trigger: none
pr: none
schedules: []

parameters:
  - name: releaseUrl
    displayName: GitHub Release page URL (https://github.com/Azure/LogicAppsUX/releases/tag/vX.Y.Z)
    type: string
    default: ''

variables:
  ArtifactName: logicappsux-npm-release-cohort
  PackageOutput: '$(Build.ArtifactStagingDirectory)/logicappsux-npm-release-cohort'

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: ubuntu-latest
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
      - stage: Release
        displayName: Build and verify npm packages for one GitHub Release
        jobs:
          - job: BuildRelease
            displayName: Resolve release, build exact source, pack and validate
            workspace:
              clean: all
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: '$(PackageOutput)'
                  artifactName: '$(ArtifactName)'
            steps:
              # Recipe checkout only; the released source is fetched separately at the verified SHA.
              - checkout: self
                clean: true
                persistCredentials: false
              - task: UseNode@1
                displayName: Use Node 24
                inputs:
                  version: '24.x'
              - bash: node scripts/ado-npm-publisher.cjs build-release-artifact
                displayName: Resolve the release URL, build its exact commit and validate nine tarballs
                workingDirectory: '$(Build.Repository.LocalPath)'
                env:
                  BASH_ENV: /dev/null
                  RELEASE_URL: ${{ parameters.releaseUrl }}
                  BUILD_REASON: '$(Build.Reason)'
                  BUILD_ID: '$(Build.BuildId)'
                  RECIPE_SHA: '$(Build.SourceVersion)'
                  SOURCE_REPOSITORY: '$(Build.Repository.Name)'
                  AGENT_TMP: '$(Agent.TempDirectory)'
                  ARTIFACT_ROOT: '$(PackageOutput)'
              # Publish the manifest digest as a job output so the verifier pins the exact uploaded manifest.
              - bash: |
                  set -euo pipefail
                  python3 -I - <<'PY'
                  import hashlib, json, os, re, stat
                  path = os.path.join(os.environ['PACKAGE_OUTPUT'], 'publisher-artifact.json')
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
                  with os.fdopen(fd, 'rb') as handle:
                      if not stat.S_ISREG(os.fstat(handle.fileno()).st_mode):
                          raise SystemExit('Manifest is not a regular file.')
                      data = handle.read(128 * 1024 + 1)
                  if len(data) > 128 * 1024:
                      raise SystemExit('Manifest is too large.')
                  sha = json.loads(data)['source']['verifiedSha']
                  if not isinstance(sha, str) or not re.fullmatch(r'[0-9a-f]{40}', sha):
                      raise SystemExit('Manifest source SHA is invalid.')
                  print('##vso[task.setvariable variable=ManifestSha256;isOutput=true]' + hashlib.sha256(data).hexdigest())
                  print('##vso[task.setvariable variable=SourceSha;isOutput=true]' + sha)
                  PY
                name: manifest
                displayName: Record manifest digest and source SHA
                env:
                  BASH_ENV: /dev/null
                  PACKAGE_OUTPUT: '$(PackageOutput)'

          # Artifact-only consumer: no repository checkout, no tool from the artifact is executed, and every
          # byte is checked against this run's manifest digest, release URL, build ID and recipe commit.
          - job: VerifyRelease
            displayName: Verify the same-run artifact without a checkout
            dependsOn: BuildRelease
            variables:
              ExpectedManifestSha256: $[ dependencies.BuildRelease.outputs['manifest.ManifestSha256'] ]
              ExpectedSourceSha: $[ dependencies.BuildRelease.outputs['manifest.SourceSha'] ]
            templateContext:
              inputs:
                - input: pipelineArtifact
                  buildType: current
                  artifactName: '$(ArtifactName)'
                  targetPath: '$(Pipeline.Workspace)/release-artifact'
            steps:
              - checkout: none
              - bash: |
                  set -euo pipefail
                  python3 -I - <<'PY'
                  import base64, hashlib, json, os, re, stat
                  prefix = 'https://github.com/Azure/LogicAppsUX/releases/tag/'
                  url = os.environ['RELEASE_URL']
                  match = re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', url[len(prefix):]) if url.startswith(prefix) else None
                  if match is None or len(url) > 200:
                      raise SystemExit('Invalid GitHub Release page URL.')
                  version = '.'.join(match.groups())
                  hex40 = re.compile(r'[0-9a-f]{40}')
                  build_id, recipe_sha, source_sha = os.environ['BUILD_ID'], os.environ['RECIPE_SHA'].lower(), os.environ['SOURCE_SHA']
                  manifest_sha256 = os.environ['EXPECTED_MANIFEST_SHA256']
                  if not re.fullmatch(r'[1-9]\d{0,14}', build_id) or not hex40.fullmatch(recipe_sha) or not hex40.fullmatch(source_sha):
                      raise SystemExit('Run identity is invalid.')
                  if not re.fullmatch(r'[0-9a-f]{64}', manifest_sha256):
                      raise SystemExit('Expected manifest digest is missing.')
                  packages = ['logic-apps-shared', 'designer-ui', 'designer-ui-v2', 'logic-apps-chatbot', 'logic-apps-designer',
                              'logic-apps-designer-v2', 'logic-apps-data-mapper', 'logic-apps-data-mapper-v2', 'vscode-extension-logic-apps']
                  files = ['microsoft-%s-%s.tgz' % (name, version) for name in packages]
                  root = os.environ['ARTIFACT_DIR']
                  if not stat.S_ISDIR(os.lstat(root).st_mode) or os.path.realpath(root) != os.path.abspath(root):
                      raise SystemExit('Artifact directory is not confined.')
                  # 1ES adds a reserved _manifest/ SBOM directory to pipeline artifacts; it is never read here.
                  entries = os.listdir(root)
                  if '_manifest' in entries:
                      if not stat.S_ISDIR(os.lstat(os.path.join(root, '_manifest')).st_mode):
                          raise SystemExit('Reserved _manifest entry is not a directory.')
                      entries.remove('_manifest')
                  if sorted(entries) != sorted(files + ['publisher-artifact.json']):
                      raise SystemExit('Artifact must contain exactly the nine tarballs and the manifest.')
                  def read_regular(name, limit):
                      try:
                          fd = os.open(os.path.join(root, name), os.O_RDONLY | os.O_NOFOLLOW)
                      except OSError:
                          raise SystemExit('Artifact entry is not a regular file: ' + name)
                      with os.fdopen(fd, 'rb') as handle:
                          if not stat.S_ISREG(os.fstat(handle.fileno()).st_mode):
                              raise SystemExit('Artifact entry is not a regular file: ' + name)
                          data = handle.read(limit + 1)
                      if len(data) > limit:
                          raise SystemExit('Artifact entry is too large: ' + name)
                      return data
                  manifest = read_regular('publisher-artifact.json', 128 * 1024)
                  if hashlib.sha256(manifest).hexdigest() != manifest_sha256:
                      raise SystemExit('Manifest digest does not match the producing job.')
                  record = json.loads(manifest)
                  if not isinstance(record, dict) or sorted(record) != ['destination', 'packages', 'source']:
                      raise SystemExit('Manifest shape is invalid.')
                  source = record['source']
                  if not isinstance(source, dict):
                      raise SystemExit('Manifest shape is invalid.')
                  release_id = source.get('releaseId')
                  if type(release_id) is not int or release_id <= 0:
                      raise SystemExit('Manifest release ID is invalid.')
                  expected_source = {'repository': 'Azure/LogicAppsUX', 'releaseRef': 'refs/tags/v' + version, 'releaseId': release_id,
                                     'verifiedSha': source_sha, 'version': version, 'buildId': build_id, 'recipeSha': recipe_sha}
                  if source != expected_source:
                      raise SystemExit('Manifest provenance does not match this run, release tag, source SHA or recipe commit.')
                  expected_destination = {'registry': 'https://msazure.pkgs.visualstudio.com/One/_packaging/microsoft-logic-apps/npm/registry/',
                                          'feedId': '44fc6edc-394a-403a-86cd-700a15978af1', 'distTag': 'latest'}
                  if record['destination'] != expected_destination:
                      raise SystemExit('Manifest destination is invalid.')
                  expected_packages = []
                  for name, file in zip(packages, files):
                      data = read_regular(file, 64 * 1024 * 1024)
                      expected_packages.append({'name': '@microsoft/' + name, 'version': version, 'file': file,
                                                'integrity': 'sha512-' + base64.b64encode(hashlib.sha512(data).digest()).decode(),
                                                'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
                  if record['packages'] != expected_packages:
                      raise SystemExit('Package identity or integrity mismatch.')
                  print('Verified nine packages for v%s at %s from build %s.' % (version, source_sha, build_id))
                  PY
                displayName: Verify manifest digest, provenance and nine tarballs
                env:
                  BASH_ENV: /dev/null
                  ARTIFACT_DIR: '$(Pipeline.Workspace)/release-artifact'
                  RELEASE_URL: ${{ parameters.releaseUrl }}
                  BUILD_ID: '$(Build.BuildId)'
                  RECIPE_SHA: '$(Build.SourceVersion)'
                  SOURCE_SHA: '$(ExpectedSourceSha)'
                  EXPECTED_MANIFEST_SHA256: '$(ExpectedManifestSha256)'

          # Intentionally credential-free. A feed writer is not wired until the hosted gates (writer
          # boundary, least-privilege identity, protected recipe ref, single writer) are verified.
          - job: ProductionPublishNotActivated
            displayName: Production publish not activated
            dependsOn: VerifyRelease
            steps:
              - checkout: none
              - bash: |
                  set -euo pipefail
                  echo '##vso[task.logissue type=warning]Verified artifact only. Production npm publishing is not activated in this pipeline.'
                displayName: Report that no feed write was attempted
                env:
                  BASH_ENV: /dev/null