parameters:
  - name: feedBaseUrl
    type: string
  - name: nodeVersion
    type: string
    default: '24.x'
  - name: dotnetVersion
    type: string
    default: '8.0.x'

steps:
  - checkout: self
    fetchDepth: 0

  - template: vscode-e2e-setup.yml
    parameters:
      feedBaseUrl: ${{ parameters.feedBaseUrl }}
      nodeVersion: ${{ parameters.nodeVersion }}
      dotnetVersion: ${{ parameters.dotnetVersion }}
      installLinuxDisplayDependencies: false

  - script: pnpm turbo run build:extension --cache-dir=.turbo
    displayName: Build VS Code extension
    workingDirectory: $(working_directory)
    env:
      NPM_CONFIG_USERCONFIG: $(npmrcFile)

  - script: npx tsup --config tsup.e2e.test.config.ts
    displayName: Compile ExTester E2E bundle
    workingDirectory: $(Build.SourcesDirectory)/apps/vs-code-designer

  - bash: |
      set -euo pipefail
      mkdir -p "$(Build.ArtifactStagingDirectory)/vscode-e2e"
      tar -czf "$(Build.ArtifactStagingDirectory)/vscode-e2e/extension-build.tar.gz" \
        apps/vs-code-designer/dist \
        apps/vs-code-designer/out
    displayName: Stage reusable VS Code E2E build artifact
    workingDirectory: $(Build.SourcesDirectory)
