parameters:
  - name: feedBaseUrl
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: testARMServiceConnection
    type: string
  - name: checkoutRef
    type: string
  - name: pool
    type: object
    default:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux
  - name: windowsPool
    type: object
    default:
      name: VSEngSS-MicroBuild2022-1ES
      image: server2022-microbuildVS2022-1es
      os: windows
  - name: runVscodeTestCliSmoke
    type: boolean
    default: true
  - name: runMsnWeatherLifecycle
    type: boolean
    default: true
  - name: azureTenantId
    type: string
    default: c9db855a-7930-48d8-8e3c-a409a38faab3
  - name: azureSubscriptionId
    type: string
    default: f11e76f5-6d71-4e8b-9571-9c5f147628ed
  - name: azureResourceGroupName
    type: string
    default: LogicAppsVSCode-E2E-Fixtures
  - name: azureLocationName
    type: string
    default: westus
  - name: testCliRuns
    type: object
    default:
      - jobName: VscodeE2ECliSmoke
        displayName: vscode-test CLI smoke (unitTests)
        label: unitTests
      - jobName: VscodeE2ECliCreateWorkspaceBehavior
        displayName: vscode-test CLI create workspace behavior
        label: createWorkspaceBehavior
      - jobName: VscodeE2ECliCreateWorkspaceCoreMatrix
        displayName: vscode-test CLI create workspace core matrix
        label: createWorkspaceCoreMatrix
      - jobName: VscodeE2ECliCreateWorkspacePreviewMatrix
        displayName: vscode-test CLI create workspace preview matrix
        label: createWorkspacePreviewMatrix
      - jobName: VscodeE2ECliCreateWorkspaceCodeful
        displayName: vscode-test CLI create workspace codeful
        label: createWorkspaceCodeful
  - name: windowsTestCliRuns
    type: object
    default:
      - jobName: VscodeE2ECliWindowsSmoke
        displayName: vscode-test CLI Windows smoke (unitTests)
        label: unitTests
        artifactName: windows-unitTests
      - jobName: VscodeE2ECliWindowsCreateWorkspaceBehavior
        displayName: vscode-test CLI Windows create workspace behavior
        label: createWorkspaceBehaviorSmoke
        artifactName: windows-createWorkspaceBehaviorSmoke
  - name: scenarioShards
    type: object
    default: []

stages:
  - stage: VscodeE2E
    displayName: VS Code E2E validation
    dependsOn: ${{ parameters.dependsOn }}
    jobs:
      - job: BuildVscodeE2EArtifacts
        displayName: Build VS Code E2E artifacts
        timeoutInMinutes: 30
        pool: ${{ parameters.pool }}
        templateContext:
          outputs:
            - output: pipelineArtifact
              targetPath: $(Build.ArtifactStagingDirectory)/vscode-e2e
              artifactName: vscode-e2e-build
        steps:
          - template: vscode-e2e-build-artifacts.yml
            parameters:
              feedBaseUrl: ${{ parameters.feedBaseUrl }}
              checkoutRef: ${{ parameters.checkoutRef }}

      - ${{ if eq(parameters.runVscodeTestCliSmoke, true) }}:
          - ${{ each cliRun in parameters.testCliRuns }}:
              - template: vscode-e2e-run-cli.yml
                parameters:
                  jobName: ${{ cliRun.jobName }}
                  displayName: ${{ cliRun.displayName }}
                  label: ${{ cliRun.label }}
                  artifactName: ${{ cliRun.label }}
                  feedBaseUrl: ${{ parameters.feedBaseUrl }}
                  pool: ${{ parameters.pool }}
                  dependsOn:
                    - BuildVscodeE2EArtifacts
                  checkoutRef: ${{ parameters.checkoutRef }}
                  testARMServiceConnection: ${{ parameters.testARMServiceConnection }}
                  platform: linux

          - ${{ each cliRun in parameters.windowsTestCliRuns }}:
              - template: vscode-e2e-run-cli.yml
                parameters:
                  jobName: ${{ cliRun.jobName }}
                  displayName: ${{ cliRun.displayName }}
                  label: ${{ cliRun.label }}
                  artifactName: ${{ cliRun.artifactName }}
                  feedBaseUrl: ${{ parameters.feedBaseUrl }}
                  pool: ${{ parameters.windowsPool }}
                  dependsOn:
                    - BuildVscodeE2EArtifacts
                  checkoutRef: ${{ parameters.checkoutRef }}
                  testARMServiceConnection: ${{ parameters.testARMServiceConnection }}
                  platform: windows

      - ${{ if eq(parameters.runMsnWeatherLifecycle, true) }}:
          - template: vscode-e2e-run-cli.yml
            parameters:
              jobName: VscodeE2EMsnWeatherLifecycle
              displayName: vscode-test CLI MSN Weather lifecycle
              label: msnWeatherLifecycle
              cliArguments: --msn-weather-lifecycle
              artifactName: msnWeatherLifecycle
              feedBaseUrl: ${{ parameters.feedBaseUrl }}
              pool: ${{ parameters.pool }}
              dependsOn:
                - BuildVscodeE2EArtifacts
              checkoutRef: ${{ parameters.checkoutRef }}
              testARMServiceConnection: ${{ parameters.testARMServiceConnection }}
              platform: linux
              requiresAzureAccessToken: true
              azureTenantId: ${{ parameters.azureTenantId }}
              azureSubscriptionId: ${{ parameters.azureSubscriptionId }}
              azureResourceGroupName: ${{ parameters.azureResourceGroupName }}
              azureLocationName: ${{ parameters.azureLocationName }}
              designerApiLoadTimeoutMs: '600000'
              timeoutInMinutes: 35
          - template: vscode-e2e-run-cli.yml
            parameters:
              jobName: VscodeE2EWindowsMsnWeatherLifecycle
              displayName: vscode-test CLI Windows MSN Weather lifecycle
              label: msnWeatherLifecycle
              cliArguments: --msn-weather-lifecycle
              artifactName: windows-msnWeatherLifecycle
              feedBaseUrl: ${{ parameters.feedBaseUrl }}
              pool: ${{ parameters.windowsPool }}
              dependsOn:
                - BuildVscodeE2EArtifacts
              checkoutRef: ${{ parameters.checkoutRef }}
              testARMServiceConnection: ${{ parameters.testARMServiceConnection }}
              platform: windows
              requiresAzureAccessToken: true
              azureTenantId: ${{ parameters.azureTenantId }}
              azureSubscriptionId: ${{ parameters.azureSubscriptionId }}
              azureResourceGroupName: ${{ parameters.azureResourceGroupName }}
              azureLocationName: ${{ parameters.azureLocationName }}
              designerApiLoadTimeoutMs: '600000'
              timeoutInMinutes: 35

      - ${{ if and(eq(parameters.runVscodeTestCliSmoke, true), eq(length(parameters.testCliRuns), 0)) }}:
          - template: vscode-e2e-run-cli.yml
            parameters:
              jobName: VscodeE2ECliSmoke
              displayName: vscode-test CLI smoke
              label: unitTests
              artifactName: unitTests
              feedBaseUrl: ${{ parameters.feedBaseUrl }}
              pool: ${{ parameters.pool }}
              dependsOn:
                - BuildVscodeE2EArtifacts
              checkoutRef: ${{ parameters.checkoutRef }}
              testARMServiceConnection: ${{ parameters.testARMServiceConnection }}
              platform: linux

      - ${{ if gt(length(parameters.scenarioShards), 0) }}:
          - template: vscode-e2e-setup-fixtures.yml
            parameters:
              jobName: SetupVscodeE2EFixtures
              displayName: setup-fixtures (p41a)
              feedBaseUrl: ${{ parameters.feedBaseUrl }}
              pool: ${{ parameters.pool }}
              dependsOn:
                - BuildVscodeE2EArtifacts
              checkoutRef: ${{ parameters.checkoutRef }}

          - ${{ each shard in parameters.scenarioShards }}:
              - template: vscode-e2e-run-scenario.yml
                parameters:
                  jobName: ${{ shard.jobName }}
                  displayName: ${{ shard.displayName }}
                  scenario: ${{ shard.scenario }}
                  useWorkspaceFixtures: ${{ shard.useWorkspaceFixtures }}
                  useBundleArtifact: ${{ shard.useBundleArtifact }}
                  feedBaseUrl: ${{ parameters.feedBaseUrl }}
                  pool: ${{ parameters.pool }}
                  dependsOn:
                    - SetupVscodeE2EFixtures
                  checkoutRef: ${{ parameters.checkoutRef }}
                  testARMServiceConnection: ''

      - template: vscode-e2e-summary.yml
        parameters:
          jobName: VscodeE2ESummary
          displayName: vscode-e2e-summary
          dependsOn:
            - ${{ if eq(parameters.runVscodeTestCliSmoke, true) }}:
                - ${{ each cliRun in parameters.testCliRuns }}:
                    - ${{ cliRun.jobName }}
                - ${{ each cliRun in parameters.windowsTestCliRuns }}:
                    - ${{ cliRun.jobName }}
            - ${{ if eq(parameters.runMsnWeatherLifecycle, true) }}:
                - VscodeE2EMsnWeatherLifecycle
                - VscodeE2EWindowsMsnWeatherLifecycle
            - ${{ if and(eq(parameters.runVscodeTestCliSmoke, true), eq(length(parameters.testCliRuns), 0)) }}:
                - VscodeE2ECliSmoke
            - ${{ if gt(length(parameters.scenarioShards), 0) }}:
                - SetupVscodeE2EFixtures
            - ${{ each shard in parameters.scenarioShards }}:
                - ${{ shard.jobName }}
