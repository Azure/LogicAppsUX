steps:
  - task: NodeTool@0
    displayName: "Using Node.js"
    inputs:
      versionSpec: '24.x'
    condition: succeeded()

  # Route package restores through the CFS feed for pipeline builds only.
  # The root .npmrc stays on the public registry so local dev and GitHub Actions are unaffected.
  - script: |
      echo.>> .npmrc
      type .azure-pipelines\.npmrc >> .npmrc
      type .npmrc
    displayName: "Apply CFS registry config (pipeline only)"
    condition: succeeded()

  - task: NpmAuthenticate@0
    displayName: "Authenticate with CFS npm feed"
    inputs:
      workingFile: .npmrc
    condition: succeeded()

  - script: npm install -g pnpm
    displayName: "Install pnpm"
    env:
      npm_config_registry: https://pkgs.dev.azure.com/msazure/one/_packaging/one_PublicPackages/npm/registry/
    condition: succeeded()

  - script: pnpm install --frozen-lockfile --strict-peer-dependencies --recursive
    displayName: "Install Dependencies with pnpm"
    workingDirectory: $(working_directory)
    condition: succeeded()
