parameters:
  - name: jobName
    type: string
  - name: displayName
    type: string
  - name: label
    type: string
    default: unitTests
  - name: artifactName
    type: string
  - name: feedBaseUrl
    type: string
  - name: nodeVersion
    type: string
    default: '24.x'
  - name: dotnetVersion
    type: string
    default: '8.0.x'
  - name: timeoutInMinutes
    type: number
    default: 35
  - name: pool
    type: object
  - name: dependsOn
    type: object
    default: []
  - name: checkoutRef
    type: string
    default: ''
  - name: testARMServiceConnection
    type: string
    default: ''
  - name: platform
    type: string
    default: linux

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool: ${{ parameters.pool }}
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/vscode-e2e-cli/${{ parameters.artifactName }}/results
          artifactName: vscode-e2e-cli-test-results-${{ parameters.artifactName }}
          condition: always()
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/vscode-e2e-cli/${{ parameters.artifactName }}/log
          artifactName: vscode-e2e-cli-log-${{ parameters.artifactName }}
          condition: always()
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/vscode-e2e-cli/${{ parameters.artifactName }}/screenshots
          artifactName: vscode-e2e-cli-screenshots-${{ parameters.artifactName }}
          condition: always()
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/diagnostics
          artifactName: vscode-test-diagnostics-${{ parameters.jobName }}
          condition: always()
    steps:
      - checkout: self
        fetchDepth: 0

      - ${{ if ne(parameters.checkoutRef, '') }}:
          - script: git checkout ${{ parameters.checkoutRef }}
            displayName: Checkout VS Code E2E ref

      - template: vscode-e2e-setup.yml
        parameters:
          feedBaseUrl: ${{ parameters.feedBaseUrl }}
          nodeVersion: ${{ parameters.nodeVersion }}
          dotnetVersion: ${{ parameters.dotnetVersion }}
          installLinuxDisplayDependencies: ${{ eq(parameters.platform, 'linux') }}

      - download: current
        artifact: vscode-e2e-build
        displayName: Download VS Code E2E build artifact

      - ${{ if eq(parameters.platform, 'linux') }}:
          - bash: |
              set -euo pipefail
              tar -xzf "$(Pipeline.Workspace)/vscode-e2e-build/extension-build.tar.gz" -C "$(Build.SourcesDirectory)"
            displayName: Extract VS Code E2E build artifact

      - ${{ if eq(parameters.platform, 'windows') }}:
          - pwsh: |
              tar -xzf "$(Pipeline.Workspace)\vscode-e2e-build\extension-build.tar.gz" -C "$(Build.SourcesDirectory)"
            displayName: Extract VS Code E2E build artifact

      - ${{ if ne(parameters.testARMServiceConnection, '') }}:
          - task: AzureCLI@2
            displayName: Verify test service connection
            inputs:
              azureSubscription: ${{ parameters.testARMServiceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                # Mirrors microsoft/vscode-azuretools azdo-pipelines/templates/test.yml.
                # AZURESUBSCRIPTION_SERVICE_CONNECTION_ID is set by AzureCLI@2 when addSpnToEnvironment=true.
                Write-Host "##vso[task.setvariable variable=FC_SERVICE_CONNECTION_ID]$env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
                Write-Host "##vso[task.setvariable variable=FC_SERVICE_CONNECTION_CLIENT_ID]$env:servicePrincipalId"
                Write-Host "##vso[task.setvariable variable=FC_SERVICE_CONNECTION_TENANT_ID]$env:tenantId"

      - ${{ if eq(parameters.platform, 'linux') }}:
          - bash: |
              set -euo pipefail
              export PATH="$(dirname "$(which node)"):/usr/local/bin:/usr/bin:/bin:$PATH"
              xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
                node apps/vs-code-designer/out/test/run-e2e.js
            displayName: Prepare vscode-test CLI extension dependencies
            env:
              LA_E2E_PREPARE_EXTENSION_DEPENDENCIES_ONLY: '1'
              NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection --max-old-space-size=4096
              TEMP: $(Agent.TempDirectory)
              TMPDIR: $(Agent.TempDirectory)

      - ${{ if eq(parameters.platform, 'windows') }}:
          - pwsh: |
              $env:PATH = "$(Build.SourcesDirectory)\apps\vs-code-designer\node_modules\.bin;$(Build.SourcesDirectory)\node_modules\.bin;$env:PATH"
              node apps/vs-code-designer/out/test/run-e2e.js
            displayName: Prepare vscode-test CLI extension dependencies
            env:
              LA_E2E_PREPARE_EXTENSION_DEPENDENCIES_ONLY: '1'
              NODE_OPTIONS: --max-old-space-size=4096
              TEMP: $(Agent.TempDirectory)
              TMP: $(Agent.TempDirectory)

      - ${{ if eq(parameters.platform, 'linux') }}:
          - bash: |
              set -euo pipefail
              /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
              export PATH="$(Build.SourcesDirectory)/apps/vs-code-designer/node_modules/.bin:$(Build.SourcesDirectory)/node_modules/.bin:$PATH"
              cd "$(Build.SourcesDirectory)/apps/vs-code-designer"
              mkdir -p .vscode-test/results
              set +e
              node scripts/run-e2e-cli.js --label ${{ parameters.label }} 2>&1 | tee ".vscode-test/results/${{ parameters.label }}.log"
              status=${PIPESTATUS[0]}
              set -e
              outcome='success'
              if [ "$status" -ne 0 ]; then
                outcome='failure'
              fi
              node scripts/summarize-e2e-cli-results.js \
                --label "${{ parameters.label }}" \
                --log ".vscode-test/results/${{ parameters.label }}.log" \
                --out-dir ".vscode-test/results" \
                --outcome "$outcome"
              exit "$status"
            displayName: Run vscode-test CLI (${{ parameters.label }})
            env:
              DISPLAY: :99
              LA_E2E_CLI_EXTENSIONS_DIR: $(Agent.TempDirectory)/test-resources/test-extensions
              NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
              TEMP: $(Agent.TempDirectory)
              TMPDIR: $(Agent.TempDirectory)
              ${{ if ne(parameters.testARMServiceConnection, '') }}:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                FC_SERVICE_CONNECTION_NAME: ${{ parameters.testARMServiceConnection }}
                FC_SERVICE_CONNECTION_ID: $(FC_SERVICE_CONNECTION_ID)
                FC_SERVICE_CONNECTION_CLIENT_ID: $(FC_SERVICE_CONNECTION_CLIENT_ID)
                FC_SERVICE_CONNECTION_TENANT_ID: $(FC_SERVICE_CONNECTION_TENANT_ID)
                AzCode_UseAzureFederatedCredentials: true
                AzCode_ServiceConnectionID: $(FC_SERVICE_CONNECTION_ID)
                AzCode_ServiceConnectionDomain: $(FC_SERVICE_CONNECTION_TENANT_ID)
                AzCode_ServiceConnectionClientID: $(FC_SERVICE_CONNECTION_CLIENT_ID)

      - ${{ if eq(parameters.platform, 'windows') }}:
          - pwsh: |
              $env:PATH = "$(Build.SourcesDirectory)\apps\vs-code-designer\node_modules\.bin;$(Build.SourcesDirectory)\node_modules\.bin;$env:PATH"
              Set-Location "$(Build.SourcesDirectory)\apps\vs-code-designer"
              New-Item -ItemType Directory -Force -Path ".vscode-test\results" | Out-Null
              & node scripts/run-e2e-cli.js --label ${{ parameters.label }} 2>&1 | Tee-Object -FilePath ".vscode-test\results\${{ parameters.label }}.log"
              $status = $LASTEXITCODE
              $outcome = if ($status -eq 0) { 'success' } else { 'failure' }
              & node scripts/summarize-e2e-cli-results.js `
                --label "${{ parameters.label }}" `
                --log ".vscode-test\results\${{ parameters.label }}.log" `
                --out-dir ".vscode-test\results" `
                --outcome "$outcome"
              exit $status
            displayName: Run vscode-test CLI (${{ parameters.label }})
            env:
              LA_E2E_CLI_EXTENSIONS_DIR: $(Agent.TempDirectory)\test-resources\test-extensions
              NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
              TEMP: $(Agent.TempDirectory)
              TMP: $(Agent.TempDirectory)
              ${{ if ne(parameters.testARMServiceConnection, '') }}:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                FC_SERVICE_CONNECTION_NAME: ${{ parameters.testARMServiceConnection }}
                FC_SERVICE_CONNECTION_ID: $(FC_SERVICE_CONNECTION_ID)
                FC_SERVICE_CONNECTION_CLIENT_ID: $(FC_SERVICE_CONNECTION_CLIENT_ID)
                FC_SERVICE_CONNECTION_TENANT_ID: $(FC_SERVICE_CONNECTION_TENANT_ID)
                AzCode_UseAzureFederatedCredentials: true
                AzCode_ServiceConnectionID: $(FC_SERVICE_CONNECTION_ID)
                AzCode_ServiceConnectionDomain: $(FC_SERVICE_CONNECTION_TENANT_ID)
                AzCode_ServiceConnectionClientID: $(FC_SERVICE_CONNECTION_CLIENT_ID)

      - task: PublishTestResults@2
        displayName: Publish JUnit result (${{ parameters.label }})
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: apps/vs-code-designer/.vscode-test/results/${{ parameters.label }}.junit.xml
          testRunTitle: '@vscode/test-cli ${{ parameters.artifactName }}'
          failTaskOnFailedTests: false

      - pwsh: |
          $diagnosticsRoot = "$(Build.ArtifactStagingDirectory)/vscode-e2e-cli/${{ parameters.artifactName }}"
          $resultDestination = Join-Path $diagnosticsRoot 'results'
          $logDestination = Join-Path $diagnosticsRoot 'log'
          $screenshotDestination = Join-Path $diagnosticsRoot 'screenshots'
          New-Item -ItemType Directory -Force -Path $resultDestination, $logDestination, $screenshotDestination | Out-Null

          $resultRoot = Join-Path '$(Build.SourcesDirectory)' 'apps/vs-code-designer/.vscode-test/results'
          $screenshotsRoot = Join-Path '$(Build.SourcesDirectory)' 'apps/vs-code-designer/.vscode-test/screenshots/cli'

          foreach ($extension in @('json', 'junit.xml', 'summary.md')) {
            $source = Join-Path $resultRoot "${{ parameters.label }}.$extension"
            if (Test-Path $source) {
              Copy-Item $source -Destination $resultDestination -Force
            }
          }

          $log = Join-Path $resultRoot '${{ parameters.label }}.log'
          if (Test-Path $log) {
            Copy-Item $log -Destination $logDestination -Force
          }

          if (Test-Path $screenshotsRoot) {
            Copy-Item (Join-Path $screenshotsRoot '*') -Destination $screenshotDestination -Recurse -Force -ErrorAction SilentlyContinue
          }

          foreach ($directory in @($resultDestination, $logDestination, $screenshotDestination)) {
            if (-not (Get-ChildItem -Path $directory -Force -ErrorAction SilentlyContinue)) {
              Set-Content -Path (Join-Path $directory '.empty') -Value 'No files were produced for this artifact.'
            }
          }
        displayName: Stage vscode-test CLI results (${{ parameters.label }})
        condition: always()

      - pwsh: |
          New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/diagnostics" | Out-Null
          $paths = @(
            "$(Build.SourcesDirectory)/apps/vs-code-designer/.vscode-test",
            "$(Build.SourcesDirectory)/apps/vs-code-designer/out/test",
            "$(Build.SourcesDirectory)/apps/vs-code-designer/e2e/test-workspace"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Copy-Item -Recurse -Force $path "$(Build.ArtifactStagingDirectory)/diagnostics" -ErrorAction Continue
            }
          }
        displayName: Collect vscode-test diagnostics
        condition: always()
